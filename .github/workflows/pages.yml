name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate skills
        run: uv run --script scripts/validate-skills.py

      - name: Test colorset output contract
        run: uv run --script scripts/test-colorsets.py

      - name: Test standalone authoring and generated-reviewer validation
        run: |
          uv run --script skills/repository-reviewer-creator/scripts/test_skill_authoring.py
          uv run --script skills/repository-reviewer-creator/scripts/test_validate_reviewer.py
          uv run --script scripts/test-pi-eval-harness.py
          uv run --script scripts/test-bundle-validation.py

      - name: Audit runtime and full skill bundles
        run: uv run --script scripts/audit-skill-authoring.py --check-bundles --output dist/skill-authoring-audit.json

      - name: Test experimental semantic audit and reward preflight
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          uv run --script projects/semantic-skill-evaluation/scripts/test_native_reward_contract.py
          uv run --script projects/semantic-skill-evaluation/scripts/test_audit_catalog_projection.py

      - name: Validate diagram-type coverage
        run: uv run --script scripts/validate-diagram-type-coverage.py --disable-mermaid-browser-sandbox

      - name: Check repository payload
        run: uv run --script scripts/check-repo-payload.py

      - name: Test generated Pages output boundary
        run: uv run --script scripts/test-pages-output.py

      - name: Build Pages from skill assets
        run: uv run --script scripts/build-pages.py

      - name: Validate unified Pages output
        run: uv run --script scripts/validate-pages-pattern-format.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  # A separate job avoids the immediate lookup race and duplicate uploads on retry.
  # https://github.com/actions/deploy-pages/issues/451
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
