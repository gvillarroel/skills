  outputDir: ../runs/google-cloud-sku-pricing-evolution-20260825-v5-clean
  objective: >-
    Improve exact structured-answer correctness across Google Cloud SKU
    geography, identity, consumption models, list and normalized rates,
    marginal tiers, progressive costs, regional membership, catalog counts,
    and compatible SKU comparisons from a supplied normalized snapshot.
  background: >-
    The catalog and 100-question benchmark are frozen under snapshot
    gcp-pricing-636387a8dd1a10dc with sealed holdout revision v2. Change only
    transferable SKILL.md instructions.
    Never add SKU IDs, prompt phrases, prices, counts, canonical answers,
    question-family fixtures, or holdout facts. Preserve the bundled helper and
