  baselineSkill: ../../skills/google-cloud-sku-pricing
  outputDir: ../runs/google-cloud-sku-pricing-dual-source-evolution-20260826-v1
  objective: >-
    Improve the skill's exact, source-aware reliability when a user needs
    Google Cloud SKU prices from either cloud_pricing_export in BigQuery or a
    complete highly compressed Pricing API Parquet fallback, while preserving
    tier, unit, region, consumption-model, currency, and effective-time
    semantics.
  background: >-
    Change only transferable SKILL.md instructions. The bundled scripts and
    references are frozen resources. Never add task literals, SKU IDs, prompt
    phrases, SQL verifier expressions, prices, counts, canonical answers, or
    holdout facts. BigQuery tasks require documented Standard SQL over
    cloud_pricing_export. Parquet tasks require exact structured answers from
    a supplied complete public snapshot. Holdout is final validation only.

