schemaVersion: 1

evolution:
  id: asciinema-real-command-video-gepa-20260820
  baselineSkill: ../../skills/asciinema-real-command-video
  outputDir: ../runs/asciinema-real-command-video-gepa-20260820
  objective: >-
    Improve transferable reliability for authentic terminal recordings: execute
    the named real program, express text and command keys explicitly, record at
    most once after preflight, preserve useful final TUI state, and emit
    independently verifiable cast, MP4, manifest, runtime, and validation
    evidence.
  background: >-
    Do not add task answers, fixture values, executable-specific shortcuts, or
    holdout facts to SKILL.md. Keep the existing scripts and references intact;
    GEPA may propose only the SKILL.md instruction text. The corrected frozen
    verifier dataset is a new SHA-pinned benchmark because it fixes Windows
    ffprobe path translation without changing the task contracts.

harbor:
  agent:
    name: evaluations.asciinema-real-command-video.harbor_pi_agent:WorkspaceWindowsPi
    model: openai-codex/gpt-5.6-luna
    kwargs:
      version: "0.84.2"
      expected_version: "0.84.2"
      wrapper_path: C:/Users/villa/dev/skills/evaluations/asciinema-real-command-video/harbor_pi_wrapper.py
      thinking: high
  environment: evaluations.asciinema-real-command-video.harbor_wsl_environment:RecordingWorkspaceWSLEnvironment
  concurrency: 1
  rewardKey: reward
  holdoutAttempts: 1
  requiredEnv:
    - OPENAI_API_KEY

gepa:
  reflectionModel: openai/gpt-5.1
  reflectionMinibatchSize: 2
  maxMetricCalls: 12
  maxCandidateProposals: 4
  seed: 20260820

splits:
  train:
    - ../runs/asciinema-real-command-video-evolution-corrected-20260820/development
  validation:
    - ../runs/asciinema-real-command-video-evolution-corrected-20260820/validation/val-lazygit-quit-tui
    - ../runs/asciinema-real-command-video-evolution-corrected-20260820/validation/val-television-one-shot-tui
  holdout:
    - ../runs/asciinema-real-command-video-evolution-corrected-20260820/validation/val-fzf-one-shot-tui
    - ../runs/asciinema-real-command-video-evolution-corrected-20260820/validation/val-winapp-help-argv

promotion:
  minimumMeanGain: 0
  allowTaskRegressions: false
  requireNoErrors: true
