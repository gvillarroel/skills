<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="d3-git-graph" data-pattern-id="d3-pattern-d3-git-graph" role="img" viewBox="0 0 560 420" font-family="Open Sans, Arial, sans-serif" aria-labelledby="d3-git-graph-title d3-git-graph-desc"><title id="d3-git-graph-title">D3 git graph</title><desc id="d3-git-graph-desc">Branch lanes, commits, and merge geometry rendered without Mermaid.</desc><path d="M70,156H488" fill="none" stroke="#007298" stroke-width="4" stroke-linecap="round" stroke-dasharray="418 418" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" from="418" to="0" dur="0.9s" begin="0.08s" fill="freeze"></animate></path><path d="M70,156C104,156 108,252 160,252H250C308,252 318,156 370,156" fill="none" stroke="#45842a" stroke-width="4" stroke-linecap="round" stroke-dasharray="389.57550048828125 389.57550048828125" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" from="389.57550048828125" to="0" dur="1.05s" begin="0.22s" fill="freeze"></animate></path><text class="mark-label" x="34" y="160" text-anchor="start" font-weight="800" style="fill: rgb(51, 62, 72); paint-order: stroke; stroke: rgb(255, 255, 255); stroke-width: 3; stroke-linejoin: round;">main</text><text class="mark-label" x="34" y="256" text-anchor="start" font-weight="800" style="fill: rgb(51, 62, 72); paint-order: stroke; stroke: rgb(255, 255, 255); stroke-width: 3; stroke-linejoin: round;">examples</text><g><g class="git-commit" transform="translate(70,156)"><circle fill="#007298" stroke="#ffffff" stroke-width="2.2" r="10"><animate attributeName="r" from="4" to="10" dur="0.5s" begin="0.35s" fill="freeze"></animate></circle><text class="label" y="-22" text-anchor="middle" font-weight="600" style="fill: rgb(79, 79, 79); paint-order: stroke; stroke: rgb(255, 255, 255); stroke-width: 3; stroke-linejoin: round;">init</text></g><g class="git-commit" transform="translate(160,252)"><circle fill="#45842a" stroke="#ffffff" stroke-width="4" r="13"><animate attributeName="r" from="4" to="13" dur="0.5s" begin="0.375s" fill="freeze"></animate></circle><text class="label" y="28" text-anchor="middle" font-weight="800" style="fill: rgb(79, 79, 79); paint-order: stroke; stroke: rgb(255, 255, 255); stroke-width: 3; stroke-linejoin: round;">mmd</text></g><g class="git-commit" transform="translate(250,252)"><circle fill="#45842a" stroke="#ffffff" stroke-width="2.2" r="10"><animate attributeName="r" from="4" to="10" dur="0.5s" begin="0.39999999999999997s" fill="freeze"></animate></circle><text class="label" y="28" text-anchor="middle" font-weight="600" style="fill: rgb(79, 79, 79); paint-order: stroke; stroke: rgb(255, 255, 255); stroke-width: 3; stroke-linejoin: round;">md</text></g><g class="git-commit" transform="translate(250,156)"><circle fill="#e77204" stroke="#ffffff" stroke-width="2.2" r="10"><animate attributeName="r" from="4" to="10" dur="0.5s" begin="0.425s" fill="freeze"></animate></circle><text class="label" y="-22" text-anchor="middle" font-weight="600" style="fill: rgb(79, 79, 79); paint-order: stroke; stroke: rgb(255, 255, 255); stroke-width: 3; stroke-linejoin: round;">validator</text></g><g class="git-commit" transform="translate(370,156)"><circle fill="#652f6c" stroke="#ffffff" stroke-width="2.2" r="10"><animate attributeName="r" from="4" to="10" dur="0.5s" begin="0.44999999999999996s" fill="freeze"></animate></circle><text class="label" y="-22" text-anchor="middle" font-weight="600" style="fill: rgb(79, 79, 79); paint-order: stroke; stroke: rgb(255, 255, 255); stroke-width: 3; stroke-linejoin: round;">merge</text></g><g class="git-commit" transform="translate(488,156)"><circle fill="#9e1b32" stroke="#ffffff" stroke-width="2.2" r="10"><animate attributeName="r" from="4" to="10" dur="0.5s" begin="0.475s" fill="freeze"></animate></circle><text class="label" y="-22" text-anchor="middle" font-weight="600" style="fill: rgb(79, 79, 79); paint-order: stroke; stroke: rgb(255, 255, 255); stroke-width: 3; stroke-linejoin: round;">verify</text></g></g><text class="caption" x="370" y="188" text-anchor="middle" style="fill: rgb(79, 79, 79); paint-order: stroke; stroke: rgb(255, 255, 255); stroke-width: 3; stroke-linejoin: round;">examples/mermaid</text></svg>
