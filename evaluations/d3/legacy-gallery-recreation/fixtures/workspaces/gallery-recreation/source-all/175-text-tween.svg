<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="text-tween" data-pattern-id="d3-pattern-text-tween" role="img" viewBox="0 0 560 420" font-family="Open Sans, Arial, sans-serif" aria-labelledby="text-tween-title text-tween-desc"><title id="text-tween-title">Text tween</title><desc id="text-tween-desc">Counters and labels animate value changes directly.</desc><g><g transform="translate(122,210)"><circle r="56" fill="#cdf3ff" fill-opacity="0.78" stroke="#007298" stroke-width="2.8"></circle><text text-anchor="middle" dy=".18em" font-size="24" font-weight="800" fill="#333e48">86<animate attributeName="opacity" from="0" to="1" dur=".25s" begin="0.08s" fill="freeze"></animate><animate attributeName="data-value" from="42" to="86" dur=".9s" begin="0.08s" fill="freeze"></animate></text><text class="mark-label" fill="#007298" text-anchor="middle" dy="82" style="fill: rgb(0, 114, 152); paint-order: stroke; stroke: rgb(255, 255, 255); stroke-width: 3; stroke-linejoin: round;">Reach</text><text class="mark-label" text-anchor="middle" dy="101" style="fill: rgb(51, 62, 72); paint-order: stroke; stroke: rgb(255, 255, 255); stroke-width: 3; stroke-linejoin: round;">42 -&gt; 86</text></g><g transform="translate(280,210)"><circle r="56" fill="#dbffcc" fill-opacity="0.78" stroke="#45842a" stroke-width="2.8"></circle><text text-anchor="middle" dy=".18em" font-size="24" font-weight="800" fill="#333e48">74<animate attributeName="opacity" from="0" to="1" dur=".25s" begin="0.16s" fill="freeze"></animate><animate attributeName="data-value" from="38" to="74" dur=".9s" begin="0.16s" fill="freeze"></animate></text><text class="mark-label" fill="#45842a" text-anchor="middle" dy="82" style="fill: rgb(69, 132, 42); paint-order: stroke; stroke: rgb(255, 255, 255); stroke-width: 3; stroke-linejoin: round;">Quality</text><text class="mark-label" text-anchor="middle" dy="101" style="fill: rgb(51, 62, 72); paint-order: stroke; stroke: rgb(255, 255, 255); stroke-width: 3; stroke-linejoin: round;">38 -&gt; 74</text></g><g transform="translate(438,210)"><circle r="56" fill="#ffccd5" fill-opacity="0.78" stroke="#9e1b32" stroke-width="2.8"></circle><text text-anchor="middle" dy=".18em" font-size="24" font-weight="800" fill="#333e48">29<animate attributeName="opacity" from="0" to="1" dur=".25s" begin="0.24s" fill="freeze"></animate><animate attributeName="data-value" from="61" to="29" dur=".9s" begin="0.24s" fill="freeze"></animate></text><text class="mark-label" fill="#9e1b32" text-anchor="middle" dy="82" style="fill: rgb(158, 27, 50); paint-order: stroke; stroke: rgb(255, 255, 255); stroke-width: 3; stroke-linejoin: round;">Risk</text><text class="mark-label" text-anchor="middle" dy="101" style="fill: rgb(51, 62, 72); paint-order: stroke; stroke: rgb(255, 255, 255); stroke-width: 3; stroke-linejoin: round;">61 -&gt; 29</text></g></g></svg>
