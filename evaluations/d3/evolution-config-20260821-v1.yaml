schemaVersion: 1

evolution:
  id: d3-compaction-reward-evolution-20260821-v1
  baselineSkill: ../../skills/d3
  outputDir: ../runs/d3-evolution-20260821-v5-gepa
  objective: >-
    Improve the compact unified D3 skill's transferable reliability and mean
    Pareto reward across visualization, recomposition, logo, and evaluation
    routes while keeping SKILL.md concise and preserving all public contracts.
  background: >-
    The immutable runtime has already consolidated small pattern recipes into
    anchored collections. Do not add benchmark answers, generated nonces,
    task-specific labels, values, selectors, or holdout facts to SKILL.md. Keep
    the deterministic builder-first rule, exact colorset policy, exact output
    paths, and independent validation workflow. Holdout is final validation only.

harbor:
  agent:
    name: codex
    model: gpt-5.3-codex-spark
    kwargs:
      version: "0.147.0"
      reasoning_effort: medium
      reasoning_summary: concise
      web_search: disabled
  environment: evaluations.d3.harbor_wsl_environment:WorkspaceWSLEnvironment
  concurrency: 4
  rewardKey: reward
  holdoutAttempts: 2
  requiredEnv:
    - OPENROUTER_API_KEY

gepa:
  reflectionModel: openrouter/openai/gpt-5.1
  reflectionMinibatchSize: 4
  maxMetricCalls: 12
  maxCandidateProposals: 3
  seed: 20260821

splits:
  train:
    - ../runs/d3-evolution-20260821-v1-dataset/train
  validation:
    - ../runs/d3-evolution-20260821-v1-dataset/validation
  holdout:
    - ../runs/d3-evolution-20260821-v1-dataset/holdout

promotion:
  minimumMeanGain: 0
  allowTaskRegressions: false
  requireNoErrors: true
