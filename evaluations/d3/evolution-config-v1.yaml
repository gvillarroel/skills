schemaVersion: 1

evolution:
  id: d3-unified-harbor-evolution-v1
  baselineSkill: ../../skills/d3
  outputDir: ../runs/d3-unified-gepa-20260809-v1
  objective: >-
    Improve the unified D3 skill's transferable reliability on the declared
    development and validation tasks while preserving concise instructions,
    colorset1-default routing, and all bundled runtime resources.
  background: >-
    Do not add benchmark answers, task-specific labels, values, selectors, or
    holdout facts to SKILL.md. Holdout is final validation only.

harbor:
  agent:
    name: codex
    model: gpt-5.3-codex-spark
    kwargs:
      version: "0.147.0"
      reasoning_effort: medium
      web_search: disabled
  environment: docker
  concurrency: 4
  rewardKey: reward
  holdoutAttempts: 3
  requiredEnv:
    - OPENAI_API_KEY

gepa:
  reflectionModel: openai/gpt-5.1
  reflectionMinibatchSize: 3
  maxMetricCalls: 30
  maxCandidateProposals: 6
  seed: 20260809

splits:
  train:
    - ../runs/d3-unified-harbor-20260809-v1/development
  validation:
    - ../runs/d3-unified-harbor-20260809-v1/validation
  holdout:
    - ../runs/d3-unified-harbor-20260809-v1/holdout

promotion:
  minimumMeanGain: 0
  allowTaskRegressions: false
  requireNoErrors: true
