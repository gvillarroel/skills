<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="satellite-projection" data-pattern-id="d3-pattern-satellite-projection" role="img" viewBox="0 0 560 420" font-family="Open Sans, Arial, sans-serif" aria-labelledby="satellite-projection-title satellite-projection-desc"><title id="satellite-projection-title">Satellite projection</title><desc id="satellite-projection-desc">Perspective footprint and horizon rings explain a satellite view.</desc><circle cx="280" cy="218" fill="#cdf3ff" fill-opacity="0.34" stroke="#007298" stroke-width="2" r="154"><animate attributeName="r" from="4" to="154" dur="0.55s" begin="0.08s" fill="freeze"></animate></circle><text class="mark-label" x="387.8" y="128.68" style="fill: rgb(51, 62, 72); paint-order: stroke; stroke: rgb(255, 255, 255); stroke-width: 3; stroke-linejoin: round;">horizon</text><circle cx="280" cy="218" fill="#ffe5cc" fill-opacity="0.34" stroke="#e77204" stroke-width="2" r="108"><animate attributeName="r" from="4" to="108" dur="0.55s" begin="0.16s" fill="freeze"></animate></circle><text class="mark-label" x="355.6" y="155.36" style="fill: rgb(51, 62, 72); paint-order: stroke; stroke: rgb(255, 255, 255); stroke-width: 3; stroke-linejoin: round;">scan</text><circle cx="280" cy="218" fill="#dbffcc" fill-opacity="0.34" stroke="#45842a" stroke-width="2" r="58"><animate attributeName="r" from="4" to="58" dur="0.55s" begin="0.24s" fill="freeze"></animate></circle><text class="mark-label" x="320.6" y="184.36" style="fill: rgb(51, 62, 72); paint-order: stroke; stroke: rgb(255, 255, 255); stroke-width: 3; stroke-linejoin: round;">nadir</text><path d="M280,32L222,160L338,160Z" fill="#ffccd5" fill-opacity="0.36" stroke="#9e1b32" stroke-width="2" opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.55s" begin="0.2s" fill="freeze"></animate></path><circle cx="280" cy="32" r="8" fill="#9e1b32" stroke="#fff" stroke-width="2"></circle></svg>
