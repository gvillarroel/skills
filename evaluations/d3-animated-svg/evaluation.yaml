    - id: svg-001-force-network
      description: Recreate "Force Network" with new data while preserving the SVG visual grammar.
      prompt: |-
        You are evaluating D3 SVG visual pattern recreation for the d3-animated-svg skill.
        
        Source SVG: source-all/001-force-network.svg
        Source pattern ID: d3-pattern-force-network
        Source title: Force Network
        
        Create a new-data recreation of the source SVG's visual pattern.
        
        Requirements:
        - Read the source SVG and treat it as visual grammar only.
        - Preserve the visible style family: exact viewBox, typography scale, color roles, major mark types, animation capability, text density, and layout grammar.
        - Use deterministic invented data that changes labels and numeric values; do not copy source labels or values verbatim.
        - Prefer standalone SVG output. Use D3 only when it helps recreate the geometry accurately, and keep any helper files under deliverables/001-force-network/.
        - Write the final SVG to deliverables/001-force-network/candidate.svg.
        - Write short notes to deliverables/001-force-network/NOTES.md describing the preserved pattern grammar and what data changed.
        
        Return only a brief completion note after the files are written.
