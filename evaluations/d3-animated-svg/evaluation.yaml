workspace:
  sources:
    - id: gallery-recreation-fixture
      type: local-path
      path: evaluations/d3-animated-svg/fixtures/workspaces/gallery-recreation
      target: /
  setup:
    initializeGit: true
evaluation:
  assertions:
    - type: javascript
      value: |
        const fs = process.getBuiltinModule("node:fs");
        const path = process.getBuiltinModule("node:path");
        
        const assertionContext = typeof context === "undefined" ? {} : context;
        const metadata = assertionContext?.providerResponse?.metadata ?? {};
        const workspace = metadata.workspaceDirectory ?? metadata.workingDirectory;
        if (!workspace) {
          throw new Error("Missing provider workspaceDirectory in assertion context.");
        }
        
        const promptId = assertionContext?.test?.metadata?.promptId;
        if (!promptId || !promptId.startsWith("svg-")) {
          throw new Error(`Missing or invalid prompt id: ${promptId ?? "<none>"}`);
        }
        
        const stem = promptId.slice(4);
        const sourcePath = path.resolve(workspace, "source-all", `${stem}.svg`);
        const candidatePath = path.resolve(workspace, "deliverables", stem, "candidate.svg");
        const sourceSvg = readSvg(sourcePath, "source SVG");
        const candidateSvg = readSvg(candidatePath, "candidate SVG");
        const expected = profileSvg(sourceSvg);
        const actual = profileSvg(candidateSvg);
        const failures = [];
        
        if (!actual.hasSvgRoot) {
          failures.push("candidate does not contain an SVG root");
        }
        if (expected.viewBox && actual.viewBox !== expected.viewBox) {
          failures.push(`viewBox mismatch: expected ${expected.viewBox}, got ${actual.viewBox || "<none>"}`);
        }
        if (actual.elementCount < Math.max(8, Math.floor(expected.elementCount * 0.35))) {
          failures.push(`too few SVG elements: expected at least ${Math.max(8, Math.floor(expected.elementCount * 0.35))}, got ${actual.elementCount}`);
        }
        
        for (const tag of expected.requiredMarkTags) {
          const requiredCount = Math.max(1, Math.floor(expected.tagCounts[tag] * 0.25));
          if ((actual.tagCounts[tag] ?? 0) < requiredCount) {
            failures.push(`missing ${tag} mark family: expected at least ${requiredCount}, got ${actual.tagCounts[tag] ?? 0}`);
          }
        }
        
        if (expected.animationCount > 0) {
          const requiredAnimationCount = Math.max(1, Math.floor(expected.animationCount * 0.25));
          if (actual.animationCount < requiredAnimationCount) {
            failures.push(`animation coverage too low: expected at least ${requiredAnimationCount}, got ${actual.animationCount}`);
          }
        }
        
        if (expected.colors.length >= 3) {
          const actualColorSet = new Set(actual.colors);
          const overlap = expected.colors.filter((color) => actualColorSet.has(color)).length;
          const requiredOverlap = expected.colors.length <= 8
            ? Math.max(2, Math.ceil(expected.colors.length * 0.5))
            : Math.min(8, Math.ceil(expected.colors.length * 0.35));
          if (overlap < requiredOverlap) {
            failures.push(`color-role coverage too low: expected at least ${requiredOverlap} source colors, got ${overlap}`);
          }
        }
        
        if (expected.fontSizes.length > 0) {
          if (actual.fontSizes.length === 0) {
            failures.push("candidate does not declare font sizes");
          } else {
            const minExpectedFont = Math.min(...expected.fontSizes) - 2;
            const maxExpectedFont = Math.max(...expected.fontSizes) + 2;
            const outOfRangeFonts = actual.fontSizes.filter((size) => size < minExpectedFont || size > maxExpectedFont);
            if (outOfRangeFonts.length > 0) {
              failures.push(`font-size drift: ${[...new Set(outOfRangeFonts)].sort((a, b) => a - b).join(", ")}`);
            }
          }
        }
        
        if (expected.textCount > 0) {
          const requiredTextCount = Math.max(1, Math.floor(expected.textCount * 0.35));
          if (actual.textCount < requiredTextCount) {
            failures.push(`too few text nodes: expected at least ${requiredTextCount}, got ${actual.textCount}`);
          }
        }
        
        if (expected.hasPatternId && !actual.hasPatternId) {
          failures.push("candidate is missing data-pattern-id metadata");
        }
        
        if (failures.length > 0) {
          throw new Error(`${promptId}: ${failures.join("; ")}`);
        }
        return true;
        
        function readSvg(filePath, label) {
          if (!fs.existsSync(filePath)) {
            throw new Error(`Missing ${label}: ${path.relative(workspace, filePath)}`);
          }
          return fs.readFileSync(filePath, "utf8");
        }
        
        function profileSvg(svg) {
          const markTags = ["circle", "ellipse", "rect", "path", "line", "polyline", "polygon", "text", "image", "use"];
          const tagCounts = Object.fromEntries(markTags.map((tag) => [tag, countTag(svg, tag)]));
          const elementCount = (svg.match(/<\s*[A-Za-z][\w:-]*(?=[\s>/])/g) ?? []).length;
          const animationCount = countTag(svg, "animate")
            + countTag(svg, "animateTransform")
            + countTag(svg, "animateMotion")
            + countPattern(svg, /@keyframes\b/gi)
            + countPattern(svg, /\banimation\s*:/gi);
          const textValues = [...svg.matchAll(/<text\b[^>]*>([\s\S]*?)<\/text>/gi)]
            .map((match) => stripText(match[1]))
            .filter(Boolean);
          return {
            hasSvgRoot: /<svg\b/i.test(svg),
            viewBox: svg.match(/<svg\b[^>]*\bviewBox\s*=\s*["']([^"']+)["']/i)?.[1] ?? "",
            elementCount,
            tagCounts,
            requiredMarkTags: markTags.filter((tag) => tagCounts[tag] > 0 && (tagCounts[tag] > 1 || elementCount < 48)),
            animationCount,
            colors: extractColors(svg),
            fontSizes: extractFontSizes(svg),
            textCount: textValues.length,
            hasPatternId: /\bdata-pattern-id\s*=/.test(svg),
          };
        }
        
        function countTag(svg, tag) {
          return (svg.match(new RegExp(`<\\s*${tag}(?=[\\s>/])`, "gi")) ?? []).length;
        }
        
        function countPattern(svg, pattern) {
          return (svg.match(pattern) ?? []).length;
        }
        
        function extractColors(svg) {
          const colors = new Set();
          const colorPatterns = [
            /\b(?:fill|stroke|stop-color|color)\s*=\s*["']([^"']+)["']/gi,
            /\b(?:fill|stroke|stop-color|color)\s*:\s*([^;"'}]+)/gi,
          ];
          for (const pattern of colorPatterns) {
            for (const match of svg.matchAll(pattern)) {
              collectColorValue(match[1], colors);
            }
          }
          return [...colors].sort();
        }
        
        function collectColorValue(rawValue, colors) {
          const value = rawValue.trim().toLowerCase();
          if (!value || value === "none" || value === "transparent" || value === "currentcolor" || value.startsWith("url(")) {
            return;
          }
          for (const match of value.matchAll(/#[0-9a-f]{3,8}\b/gi)) {
            colors.add(normalizeHex(match[0]));
          }
          for (const match of value.matchAll(/rgba?\([^)]*\)|hsla?\([^)]*\)/gi)) {
            colors.add(match[0].replace(/\s+/g, ""));
          }
        }
        
        function normalizeHex(color) {
          const lower = color.toLowerCase();
          if (/^#[0-9a-f]{3}$/.test(lower)) {
            return `#${lower[1]}${lower[1]}${lower[2]}${lower[2]}${lower[3]}${lower[3]}`;
          }
          return lower;
        }
        
        function extractFontSizes(svg) {
          const sizes = [];
          const patterns = [
            /\bfont-size\s*=\s*["']([0-9.]+)(?:px)?["']/gi,
            /\bfont-size\s*:\s*([0-9.]+)(?:px)?/gi,
          ];
          for (const pattern of patterns) {
            for (const match of svg.matchAll(pattern)) {
              const size = Number.parseFloat(match[1]);
              if (Number.isFinite(size)) {
                sizes.push(size);
              }
            }
          }
          return [...new Set(sizes)].sort((a, b) => a - b);
        }
        
        function stripText(text) {
          return text
            .replace(/<[^>]+>/g, " ")
            .replace(/&nbsp;/g, " ")
            .replace(/&amp;/g, "&")
            .replace(/&lt;/g, "<")
            .replace(/&gt;/g, ">")
            .replace(/\s+/g, " ")
            .trim();
        }
  requests: 1
  timeoutMs: 1200000
  tracing: false
  maxConcurrency: 1
  noCache: true
