interface:
  display_name: "PlantUML Colorset Renderer"
  short_description: "Render solid PlantUML styles with contrast checks"
  default_prompt: "Use $plantuml-colorset-renderer to render and validate these PlantUML sources with the requested colorset and formats. For Colorset1, start primary bodies red, allocate grays before black and white, and leave other hues until that capacity is used. Use opaque borderless fills, black or white labels against their actual backing, and visible complete arrows; preserve native semantic strokes."
