" cy="334" r="36" fill="none" stroke="#ffffff" stroke-width="3" opacity=".7" /></g><text class="psvg-note" x="58" y="540" fill="#000000" stroke="none">stop color + offset phase</text></g><g class="psvg-reduced-layer" data-motion-layer="reduced"><rect class="psvg-panel" x="40" y="112" width="880" height="444" rx="12" stroke="none" data-fill-style="solid" /><g class="psvg-art" data-role="procedural-art"><defs><linearGradient id="gradient-cycle-gradient-reduced" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9e1b32" /><stop offset="0.33" stop-color="#000000" /><stop offset="0.66" stop-color="#828282" /><stop offset="1" stop-color="#1c1c1c" /></linearGradient></defs><rect x="145.6" y="191.92" width="668.8" height="284.16" rx="62.16" fill="url(#gradient-cycle-gradient-reduced)" /><circle cx="216" cy="334" r="12" fill="none" stroke="#ffffff" stroke-width="3" opacity=".7" /><circle cx="304" cy="334" r="16" fill="none" stroke="#ffffff" stroke-width="3" opacity=".7" /><circle cx="392" cy="334" r="20" fill="none" stroke="#ffffff" stroke-width="3" opacity=".7" /><circle cx="480" cy="334" r="24" fill="none" stroke="#ffffff" stroke-width="3" opacity=".7" /><circle cx="568" cy="334" r="28" fill="none" stroke="#ffffff" stroke-width="3" opacity=".7" /><circle cx="656" cy="334" r="32" fill="none" stroke="#ffffff" stroke-width="3" opacity=".7" /><circle cx="744" cy="334" r="36" fill="none" stroke="#ffffff" stroke-width="3" opacity=".7" /></g><text class="psvg-note" x="58" y="540" fill="#000000" stroke="none">stop color + offset phase</text></g>
