  <title id="clip-morph-title">Clip Morph</title>
  <desc id="clip-morph-desc">A compatible clip path morphs between apertures while the clipped texture stays fixed. Deterministic seed 334717; full motion.</desc>

  <style>:root{color-scheme:light}
*{box-sizing:border-box}
.psvg-panel{fill:#ffffff;stroke:none}
.psvg-guide{fill:none;stroke:#cfcfcf;stroke-width:2}
.psvg-title{font:700 24px Arial,sans-serif;}
.psvg-subtitle{font:13px Arial,sans-serif;}
