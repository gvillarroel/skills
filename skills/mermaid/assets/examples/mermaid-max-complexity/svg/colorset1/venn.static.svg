<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 450" style="max-width: 800px; background-color: white;" role="graphics-document document" aria-roledescription="venn" aria-labelledby="mermaid-venn-colorset1-title" aria-describedby="mermaid-venn-colorset1-desc"><title id="mermaid-venn-colorset1-title">Venn maximum complexity showcase</title><desc id="mermaid-venn-colorset1-desc">Eight named sets descend from value twelve to value five and consume every available Venn set color.</desc><style>#my-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333e48;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#e7e7e7;}#my-svg .error-text{fill:#333e48;stroke:#333e48;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#696969;stroke:#696969;}#my-svg .marker.cross{stroke:#696969;}#my-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .venn-title{font-size:32px;fill:#333e48;font-family:"trebuchet ms",verdana,arial,sans-serif;}#my-svg .venn-circle text{font-size:48px;font-family:"trebuchet ms",verdana,arial,sans-serif;}#my-svg .venn-intersection text{font-size:48px;fill:#333e48;font-family:"trebuchet ms",verdana,arial,sans-serif;}#my-svg .venn-text-node{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333e48;}#my-svg .node .neo-node{stroke:#9e1b32;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#9e1b32;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><text class="venn-title" font-size="16px" text-anchor="middle" dominant-baseline="middle" x="50%" y="16" style="fill: rgb(51, 62, 72);">Venn palette capacity</text><g transform="translate(0, 24)"><g class="venn-area venn-circle venn-set-0" data-venn-sets="S01"><path d="M 219.28908236901583 87.88432419025764 &#10;m -72.88432419025764 0 &#10;a 72.88432419025764 72.88432419025764 0 1 0 145.7686483805153 0 &#10;a 72.88432419025764 72.88432419025764 0 1 0 -145.7686483805153 0" style="fill-opacity: 0.1; fill: rgb(158, 27, 50); stroke: rgb(158, 27, 50); stroke-width: 2.5; stroke-opacity: 0.95;"/><text class="label" text-anchor="middle" dy=".35em" x="219" y="87" style="fill: rgb(27, 5, 9); font-size: 24px;"><tspan x="219" y="87" dy="0.35em">Venn set 01</tspan></text></g><g class="venn-area venn-circle venn-set-1" data-venn-sets="S02"><path d="M 364.8702072371375 87.88432419025764 &#10;m -69.7814277102