-line" d="M 409.4921875 39.5 L 414.4921875 39.5" /></ns0:g><ns0:g class="railroad-rule am-step am-role-item am-effect-fade" transform="translate(0, 97)" style="--am-delay:230.000ms; --am-duration:480.000ms; --am-easing:cubic-bezier(.2, .8, .2, 1); --am-draw-distance:10000.0;"><ns0:g transform="translate(128.65625, 0.5)"><ns0:g class="railroad-terminal"><ns0:rect x="0" y="0" width="75.40625" height="39" rx="10" ry="10" /><ns0:text x="37.703125" y="19.5">number</ns0:text></ns0:g></ns0:g><ns0:g class="railroad-rule-name-group"><ns0:text class="railroad-rule-name" x="0" y="20">expression =</ns0:text></ns0:g><ns0:g class="railroad-start"><ns0:circle cx="108.65625" cy="20" r="5" /></ns0:g><ns0:g class="railroad-end"><ns0:circle cx="214.0625" cy="20" r="5" /></ns0:g><ns0:path class="railroad-line" d="M 113.65625 20 L 128.65625 20" /><ns0:path class="railroad-line" d="M 204.0625 20 L 209.0625 20" /></ns0:g></ns0:svg>