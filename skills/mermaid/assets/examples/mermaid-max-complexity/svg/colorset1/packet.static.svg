<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1026 329" style="max-width: 1026px; background-color: white;" role="graphics-document document" aria-roledescription="packet" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg"><title id="chart-title-my-svg">Packet maximum complexity showcase</title><desc id="chart-desc-my-svg">A 32-bit transport header is divided into source and destination ports, sequence and acknowledgment values, control flags, window, checksum, pointer, options, and payload fields.</desc><style>#my-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333e48;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#e7e7e7;}#my-svg .error-text{fill:#333e48;stroke:#333e48;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#696969;stroke:#696969;}#my-svg .marker.cross{stroke:#696969;}#my-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .packetByte{font-size:10px;}#my-svg .packetByte.start{fill:black;}#my-svg .packetByte.end{fill:black;}#my-svg .packetLabel{fill:black;font-size:12px;}#my-svg .packetTitle{fill:black;font-size:14px;}#my-svg .packetBlock{stroke:black;stroke-width:1;fill:#efefef;}#my-svg .node .neo-node{stroke:#9e1b32;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#9e1b32;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g><rect x="1" y="15" width="507" height="32" class="packetBlock"/><text x="254.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Source port</text><text x="1" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">0</text><text x="508" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">15</text><rect x="513" y="15" width="507" height="32" class="packetBlock"/><text x="766.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Destination port</text><text x="513" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">16</text><text x="1020" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">31</text></g><g><rect x="1" y="62" width="1019" height="32" class="packetBlock"/><text x="510.5" y="78" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Sequence number</text><text x="1" y="60" class="packetByte start" dominant-baseline="auto" text-anchor="start">32</text><text x="1020" y="60" class="packetByte end" dominant-baseline="auto" text-anchor="end">63</text></g><g><rect x="1" y="109" width="1019" height="32" class="packetBlock"/><text x="510.5" y="125" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Acknowledgment number</text><text x="1" y="107" class="packetByte start" dominant-baseline="auto" text-anchor="start">64</text><text x="1020" y="107" class="packetByte end" dominant-baseline="auto" text-anchor="end">95</text></g><g><rect x="1" y="156" width="123" height="32" class="packetBlock"/><text x="62.5" y="172" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Data offset</text><text x="1" y="154" class="packetByte start" dominant-baseline="auto" text-anchor="start">96</text><text x="124" y="154" class="packetByte end" dominant-baseline="auto" text-anchor="end">99</text><rect x="129" y="156" width="91" height="32" class="packetBlock"/><text x="174.5" y="172" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Reserved</text><text x="129" y="154" class="packetByte start" dominant-baseline="auto" text-anchor="start">100</text><text x="220" y="154" class="packetByte end" dominant-baseline="auto" text-anchor="end">102</text><rect x="225" y="156" width="27" height="32" class="packetBlock"/><text x="238.5" y="172" class="packetLabel" dominant-baseline="middle" text-anchor="middle">NS</text><text x="238.5" y="154" class="packetByte start" dominant-baseline="auto" text-anchor="middle">103</text><rect x="257" y="156" width="27" height="32" class="packetBlock"/><text x="270.5" y="172" class="packetLabel" dominant-baseline="middle" text-anchor="middle">CWR</text><text x="270.5" y="154" class="packetByte start" dominant-baseline="auto" text-anchor="middle">104</text><rect x="289" y="156" width="27" height="32" class="packetBlock"/><text x="302.5" y="172" class="packetLabel" dominant-baseline="middle" text-anchor="middle">ECE</text><text x="302.5" y="154" class="packetByte start" dominant-baseline="auto" text-anchor="middle">105</text><rect x="321" y="156" width="27" height="32" class="packetBlock"/><text x="334.5" y="172" class="packetLabel" dominant-baseline="middle" text-anchor="middle">URG</text><text x="334.5" y="154" class="packetByte start" dominant-baseline="auto" text-anchor="middle">106</text><rect x="353" y="156" width="27" height="32" class="packetBlock"/><text x="366.5" y="172" class="packetLabel" dominant-baseline="middle" text-anchor="middle">ACK</text><text x="366.5" y="154" class="packetByte start" dominant-baseline="auto" text-anchor="middle">107</text><rect x="385" y="156" width="27" height="32" class="packetBlock"/><text x="398.5" y="172" class="packetLabel" dominant-baseline="middle" text-anchor="middle">PSH</text><text x="398.5" y="154" class="packetByte start" dominant-baseline="auto" text-anchor="middle">108</text><rect x="417" y="156" width="27" height="32" class="packetBlock"/><text x="430.5" y="172" class="packetLabel" dominant-baseline="middle" text-anchor="middle">RST</text><text x="430.5" y="154" class="packetByte start" dominant-baseline="auto" text-anchor="middle">109</text><rect x="449" y="156" width="27" height="32" class="packetBlock"/><text x="462.5" y="172" class="packetLabel" dominant-baseline="middle" text-anchor="middle">SYN</text><text x="462.5" y="154" class="packetByte start" dominant-baseline="auto" text-anchor="middle">110</text><rect x="481" y="156" width="27" height="32" class="packetBlock"/><text x="494.5" y="172" class="packetLabel" dominant-baseline="middle" text-anchor="middle">FIN</text><text x="494.5" y="154" class="packetByte start" dominant-baseline="auto" text-anchor="middle">111</text><rect x="513" y="156" width="507" height="32" class="packetBlock"/><text x="766.5" y="172" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Window size</text><text x="513" y="154" class="packetByte start" dominant-baseline="auto" text-anchor="start">112</text><text x="1020" y="154" class="packetByte end" dominant-baseline="auto" text-anchor="end">127</text></g><g><rect x="1" y="203" width="507" height="32" class="packetBlock"/><text x="254.5" y="219" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Checksum</text><text x="1" y="201" class="packetByte start" dominant-baseline="auto" text-anchor="start">128</text><text x="508" y="201" class="packetByte end" dominant-baseline="auto" text-anchor="end">143</text><rect x="513" y="203" width="507" height="32" class="packetBlock"/><text x="766.5" y="219" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Urgent pointer</text><text x="513" y="201" class="packetByte start" dominant-baseline="auto" text-anchor="start">144</text><text x="1020" y="201" class="packetByte end" dominant-baseline="auto" text-anchor="end">159</text></g><g><rect x="1" y="250" width="1019" height="32" class="packetBlock"/><text x="510.5" y="266" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Options and padding</text><text x="1" y="248" class="packetByte start" dominant-baseline="auto" text-anchor="start">160</text><text x="1020" y="248" class="packetByte end" dominant-baseline="auto" text-anchor="end">191</text></g><text x="513" y="305.5" dominant-baseline="middle" text-anchor="middle" class="packetTitle">Transport header arranged in 32-bit rows</text></svg>
