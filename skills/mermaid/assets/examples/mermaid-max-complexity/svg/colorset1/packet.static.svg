<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" id="my-svg" width="100%" viewBox="0 0 1026 329" style="max-width: 1026px; background-color:white;" role="graphics-document document" aria-roledescription="packet" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg" data-colorset="colorset1" data-palette-normalization="{&quot;#b9b9b9&quot;: &quot;#b5b5b5&quot;, &quot;#efefef&quot;: &quot;#e7e7e7&quot;}" data-category-presentation="solid-first"><ns0:title id="chart-title-my-svg">Packet maximum complexity showcase</ns0:title><ns0:desc id="chart-desc-my-svg">A 32-bit transport header is divided into source and destination ports, sequence and acknowledgment values, control flags, window, checksum, pointer, options, and payload fields.</ns0:desc><ns0:style>#my-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333e48;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#6d1222;}#my-svg .error-text{fill:#ffffff;stroke:#ffffff;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#696969;stroke:#696969;}#my-svg .marker.cross{stroke:#696969;}#my-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .packetByte{font-size:10px;}#my-svg .packetByte.start{fill:black;}#my-svg .packetByte.end{fill:black;}#my-svg .packetLabel{fill:black;font-size:12px;}#my-svg .packetTitle{fill:black;font-size:14px;}#my-svg .packetBlock{stroke:black;stroke-width:1;fill:#e7e7e7;}#my-svg .node .neo-node{stroke:#9e1b32;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#9e1b32;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</ns0:style><ns0:g /><ns0:g><ns0:rect x="1" y="15" width="507" height="32" class="packetBlock" style="fill:#9e1b32 !important;fill-opacity:1 !important;opacity:1;stroke:none !important;stroke-width:0 !important;" /><ns0:text x="254.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle" style="fill:#ffffff !important;color:#ffffff !important;">Source port</ns0:text><ns0:text x="1" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">0</ns0:text><ns0:text x="508" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">15</ns0:text><ns0:rect x="513" y="15" width="507" height="32" class="packetBlock" style="fill:#9e1b32 !important;fill-opacity:1 !important;opacity:1;stroke:none !important;stroke-width:0 !important;" /><ns0:text x="766.5" y="31" class="packetLabel" domi