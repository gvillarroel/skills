<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" id="my-svg" width="100%" style="max-width: 500px; background-color:white;" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg" data-colorset="colorset1" data-palette-normalization="{&quot;#b9b9b9&quot;: &quot;#b5b5b5&quot;}" data-category-presentation="solid-first"><ns0:title id="chart-title-my-svg">Quadrant maximum complexity showcase</ns0:title><ns0:desc id="chart-desc-my-svg">Four labeled points occupy the invest, explore, defer, and maintain domains of an effort versus impact matrix.</ns0:desc><ns0:style>#my-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333e48;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#6d1222;}#my-svg .error-text{fill:#ffffff;stroke:#ffffff;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#696969;stroke:#696969;}#my-svg .marker.cross{stroke:#696969;}#my-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .node .neo-node{stroke:#9e1b32;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#9e1b32;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</ns0:style><ns0:g /><ns0:g class="main"><ns0:g class="quadrants"><ns0:g class="quadrant"><ns0:rect x="263" y="45" width="232" height="212" fill="#ffffff" style="fill:#9e1b32 !important;fill-opacity:1 !important;opacity:1;stroke:none !important;stroke-width:0 !important;" /><ns0:text x="0" y="0" fill="#333e48" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 50) rotate(0)" style="fill:#ffffff !important;color:#ffffff !important;">Invest</ns0:text></ns0:g><ns0:g class="quadrant"><ns0:rect x="31" y="45" width="232" height="212" fill="#e7e7e7" style="fill:#333e48 !important;fill-opacity:1 !important;opacity:1;stroke:none !important;stroke-width:0 !important;" /><ns0:text x="0" y="0" fill="#333e48" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 50) rotate(0)" style="fill:#ffffff !important;color:#ffffff !important;">Explore</ns0:text></ns0:g><ns0:g class="quadrant"><ns0:rect x="31" y="257" width="232" height="212" fill="#cfcfcf" style="fill:#6d1222 !important;fill-opacity:1 !important;opacity:1;stroke:none !important;stroke-width:0 !important;" /><ns0:text x="0" y="0" fill="#333e48" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 262) rotate(0)" style="fill:#ffffff !important;color:#ffffff !important;">Defer</ns0:text></ns0:g><ns0:g class="quadrant"><ns0:rect x="263" y="257" width="232" height="212" fill="#e7e7e7" style="fill:#828282 !important;fill-opacity:1 !important;opacity:1;stroke:none !important;stroke-width:0 !important;" /><ns0:text x="0" y="0" fill="#333e48" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 262) rotate(0)" style="fill:#000000 !important;color:#000000 !important;">Maintain</ns0:text></ns0:g></ns0:g><ns0:g class="border"><ns0:line x1="30" y1="45" x2="496" y2="45" style="stroke:rgb(158, 27, 50); stroke-width: 2;" /><ns0:line x1="495" y1="46" x2="495" y2="468" style="stroke:rgb(158, 27, 50); stroke-width: 2;" /><ns0:line x1="30" y1="469" x2="496" y2="469" style="stroke:rgb(158, 27, 50); stroke-width: 2;" /><ns0:line x1="31" y1="46" x2="31" y2="468" style="stroke:rgb(158, 27, 50); stroke-width: 2;" /><ns0:line x1="263" y1="46" x2="263" y2="468" style="stroke:rgb(105, 105, 105); stroke-width: 1;" /><ns0:line x1="32" y1="257" x2="494" y2="257" style="stroke:rgb(105, 105, 105); stroke-width: 1;" /></ns0:g><ns0:g class="data-points"><ns0:g class="data-point"><ns0:circle cx="379" cy="363" r="5" fill="#9e1b32" stroke="#9e1b32" stroke-width="0px" /><ns0:text x="0" y="0" fill="#333e48" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 368) rotate(0)" style="fill:#000000 !important;color:#000000 !important;">Quadrant point 04</ns0:text></ns0:g><ns0:g class="data-point"><ns0:circle cx="147" cy="363" r="5" fill="#9e1b32" stroke="#9e1b32" stroke-width="0px" /><ns0:text x="0" y="0" fill="#333e48" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 368) rotate(0)" style="fill:#ffffff !important;color:#ffffff !important;">Quadrant point 03</ns0:text></ns0:g><ns0:g class="data-point"><ns0:circle cx="147" cy="151