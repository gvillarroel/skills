ortant;color:#ffffff !important;"><html:span style="display: table-cell; text-align: center; vertical-align: middle;fill:#ffffff !important;color:#ffffff !important;"><html:b style="fill:#ffffff !important;color:#ffffff !important;">Event</html:b></html:span></html:div></ns0:foreignObject></ns0:g></ns0:g><ns0:path class="em-relation am-step am-role-edge am-effect-grow-arrow" fill="none" stroke="#696969" stroke-width="1" marker-end="url(#em-arrowhead-my-svg-contrast-0-marker-end)" d="M580.667,115 L580.667,135 L630,135 L630,152" style="--am-delay:1735.000ms; --am-duration:480.000ms; --am-easing:cubic-bezier(.2, .8, .2, 1); --am-draw-distance:10000.0; --am-grow-distance-a:6600.000; --am-grow-distance-b:2400.000; --am-grow-distance-c:360.000;stroke:#696969 !important;stroke-opacity:1 !important;--am-marker-end:url(#em-arrowhead-my-svg-contrast-0-marker-end) !important;" data-am-stage="3" data-am-branch="0" data-arrow-id="eventmodeling-arrow-0" data-arrow-gutter="event-row-clearance" /><ns0:path class="em-relation am-step am-role-edge am-effect-grow-arrow" fill="none" stroke="#696969" stroke-width="1" marker-end="url(#em-arrowhead-my-svg-contrast-1-marker-end)" d="M580.667,115 L580.667,135 L820.667,135 L820.667,152" style="--am-delay:2825.000ms; --am-duration:480.000ms; --am-easing:cubic-bezier(.2, .8, .2, 1); --am-draw-distance:10000.0; --am-grow-distance-a:6600.000; --am-grow-distance-b:2400.000; --am-grow-distance-c:360.000;stroke:#696969 !important;stroke-opacity:1 !important;--am-marker-end:url(#em-arrowhead-my-svg-contrast-1-marker-end) !important;" data-am-stage="4" data-am-branch="0" data-arrow-id="eventmodeling-arrow-1" data-arrow-gutter="event-row-clearance" /><ns0:path class="em-relation am-step am-role-edge am-effect-grow-arrow" fill="none" stroke="#696969" stroke-width="1" marker-end="url(#em-arrowhead-my-svg-contrast-2-marker-end)" d="M879.333,255 L879.333,275 L916.333,275 L916.333,292" style="--am-delay:3915.000ms; --am-duration:480.000ms; --am-easing:cubic-bezier(.2, .8, .2, 1); --am-draw-distance:10000.0; --am-grow-distance-a:6600.000; --am-grow-distance-b:2400.000; --am-grow-distance-c:360.000;stroke:#696969 !important;stroke-opacity:1 !important;--am-marker-end:url(#em-arrowhead-my-svg-contrast-2-marker-end) !important;" data-am-stage="5" data-am-branch="0" data-arrow-id="eventmodeling-arrow-2" data-arrow-gutter="event-row-clearance" /><ns0:defs><ns0:marker id="em-arrowhead-my-svg" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><ns0:polygon points="0 0, 10 3.5, 0 7" fill="#9e1b32" /></ns0:marker><ns0:marker id="em-arrowhead-my-svg-contrast-0-marker-end" markerWidth="10" markerHeight="7" refX="13.0" refY="3.5" orient="auto" data-arrow-owner="0marker-end"><ns0:polygon points="0 0, 10 3.5, 0 7" fill="#9e1b32" style="fill:#696969 !important;stroke:none !important;" /></ns0:marker><ns0:marker id="em-arrowhead-my-svg-contrast-1-marker-end" markerWidth="10" markerHeight="7" refX="13.0" refY="3.5" orient="auto" data-arrow-owner="1marker-end"><ns0:polygon points="0 0, 10 3.5, 0 7" fill="#9e1b32" style="fill:#696969 !important;stroke:none !important;" /></ns0:marker><ns0:marker id="em-arrowhead-my-svg-contrast-2-marker-end" markerWidth="10" markerHeight="7" refX="13.0" refY="3.5" orient="auto" data-arrow-owner="2marker-end"><ns0:polygon points="0 0, 10 3.5, 0 7" fill="#9e1b32" style="fill:#696969 !important;stroke:none !important;" /></ns0:marker></ns0:defs><ns0:style id="animated-mermaid-style" type="text/css">
.am-step {
  animation-delay: var(--am-delay, 0ms);
  animation-duration: var(--am-duration, 650ms);
  animation-fill-mode: backwards;
  animation-timing-function: var(--am-easing, cubic-bezier(.2, .8, .2, 1));
  transform-box: fill-box;
  transform-origin: center;
}
.am-effect-fade { animation-name: am-fade; }
.am-effect-pop { animation-name: am-pop; }
.am-effect-slide-up { animation-name: am-slide-up; }
.am-effect-slide-left { animation-name: am-slide-left; }
.am-effect-zoom { animation-name: am-zoom; }
.am-effect-draw { animation-name: am-draw; }
.am-effect-radial-arrow,
.am-effect-grow-arrow {
  animation-name: am-grow-arrow;
  animation-timing-function: cubic-bezier(.16, .84, .28, 1);
  stroke-linecap: round;
  stroke-linejoin: round;
}
.am-effect-radial-arrow { animation-name: am-radial-arrow; }
@keyframes am-fade {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes am-pop {
  0% { opacity: 0; transform: scale(.92); }
  70% { opacity: 1; transform: scale(1.025); }
  100% { opacity: 1; transform: none; }
}
@keyframes am-slide-up {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}
@keyframes am-slide-left {
  from { opacity: 0; transform: translateX(18px); }
  to { opacity: 1; transform: none; }
}
@keyframes am-zoom {
  from { opacity: 0; transform: scale(.86); }
  to { opacity: 1; transform: none; }
}
@keyframes am-draw {
  from {
    opacity: 0;
    stroke-dasharray: var(--am-draw-distance, 10000);
    stroke-dashoffset: var(--am-draw-distance, 10000);
  }
  12% { opacity: 1; }
  to {
    opacity: 1;
    stroke-dasharray: var(--am-draw-distance, 10000);
    stroke-dashoffset: 0;
  }
}
@keyframes am-grow-arrow {
  0% {
    opacity: 0;
    marker-start: none;
    marker-mid: none;
    marker-end: none;
    stroke-dasharray: var(--am-draw-distance, 10000);
    stroke-dashoffset: var(--am-draw-distance, 10000);
  }
  8% {
    opacity: 1;
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
  }
  34% {
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
    stroke-dasharray: var(--am-draw-distance, 10000);
    stroke-dashoffset: var(--am-grow-distance-a, 6600);
  }
  62% {
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
    stroke-dashoffset: var(--am-grow-distance-b, 2400);
  }
  84% {
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
    stroke-dashoffset: var(--am-grow-distance-c, 360);
  }
  100% {
    opacity: 1;
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
    stroke-dasharray: var(--am-draw-distance, 10000);
    stroke-dashoffset: 0;
  }
}
@keyframes am-radial-arrow {
  0% {
    opacity: 0;
    marker-start: none;
    marker-mid: none;
    marker-end: none;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
  }
  10% {
    opacity: 1;
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
  }
  38% {
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
    stroke-dasharray: 1;
    stroke-dashoffset: .66;
  }
  66% {
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
    stroke-dashoffset: .24;
  }
  86% {
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
    stroke-dashoffset: .05;
  }
  100% {
    opacity: 1;
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
    stroke-dasharray: 1;
    stroke-dashoffset: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  .am-step {
    animation: none !important;
    opacity: initial !important;
    transform: none !important;
    stroke-dasharray: initial !important;
    stroke-dashoffset: initial !important;
  }
}
</ns0:style></ns0:svg>
