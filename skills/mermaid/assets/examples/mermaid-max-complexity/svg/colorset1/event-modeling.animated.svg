<ns0:svg xmlns:html="http://www.w3.org/1999/xhtml" xmlns:ns0="http://www.w3.org/2000/svg" id="my-svg" width="100%" style="max-width: 1098px; background-color:white;" viewBox="-30 -30 1098 470" role="graphics-document document" aria-roledescription="eventmodeling" data-colorset="colorset1" data-palette-normalization="{&quot;#b9b9b9&quot;: &quot;#b5b5b5&quot;, &quot;#f0f0f0&quot;: &quot;#f7f7f7&quot;, &quot;#fafafa&quot;: &quot;#f7f7f7&quot;}" data-animated-mermaid="true" data-animation="sequence" data-element-count="11" aria-labelledby="mermaid-event-modeling-colorset1-title" aria-describedby="mermaid-event-modeling-colorset1-desc" data-category-presentation="solid-first" data-arrow-contrast="native-resting-3to1"><ns0:title id="mermaid-event-modeling-colorset1-title">Event Modeling maximum complexity showcase</ns0:title><ns0:desc id="mermaid-event-modeling-colorset1-desc">One timeline frame each represents a user interface, processor, read model, command, and event role.</ns0:desc><ns0:style>#my-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333e48;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#6d1222;}#my-svg .error-text{fill:#ffffff;stroke:#ffffff;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#696969;stroke:#696969;}#my-svg .marker.cross{stroke:#696969;}#my-svg svg{font-family:"trebuchet ms",verdana,arial,san