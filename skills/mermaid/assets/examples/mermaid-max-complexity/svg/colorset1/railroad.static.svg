<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" id="my-svg" width="100%" class="railroad-diagram" style="max-width: 444.492px; background-color:white;" viewBox="0 0 444.4921875 174.5" role="graphics-document document" aria-roledescription="railroadEbnf" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg"><ns0:title id="chart-title-my-svg">Railroad maximum complexity showcase</ns0:title><ns0:desc id="chart-desc-my-svg">The root grammar requires an identifier and expression, may include an operator, and resolves the expression to a number.</ns0:desc><ns0:style>#my-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333e48;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#e7e7e7;}#my-svg .error-text{fill:#333e48;stroke:#333e48;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#696969;stroke:#696969;}#my-svg .marker.cross{stroke:#696969;}#my-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .railroad-diagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#my-svg .railroad-terminal rect{fill:#f7f7f7;stroke:#4f4f4f;stroke-width:2px;}#my-svg .railroad-terminal text{fill:#333e48;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;text-anchor:middle;dominant-baseline:middle;}#my-svg .railroad-nonterminal rect{fill:#ffccd5;stroke:#9e1b32;stroke-width:2px;}#my-svg .railroad-nonterminal text{fill:#333e48;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;text-anchor:middle;dominant-baseline:middle;}#my-svg .railroad-line{stroke:#696969;stroke-width:2px;fill:none;}#my-svg .railroad-start circle,#my-svg .railroad-end circle{fill:#696969;}#my-svg .railroad-comment ellipse{fill:rgba(231,231,231,0.8);stroke:#9c9c9c;stroke-width:2px;}#my-svg .railroad-comment text{fill:#333e48;font-style:italic;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;text-anchor:middle;dominant-baseline:middle;}#my-svg .railroad-special rect{fill:#e7e7e7;stroke:#9c9c9c;stroke-width:2px;stroke-dasharray:5,3;}#my-svg .railroad-special text{fill:#333e48;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;text-anchor:middle;dominant-baseline:middle;}#my-svg .railroad-rule-name{font-weight:bold;fill:#333e48;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#my-svg .node .neo-node{stroke:#9e1b32;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#9e1b32;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</ns0:style><ns0:g /><ns0:g class="railroad-rule" transform="translate(0, 10)"><ns0:g transform="translate(82.953125, 0)"><ns0:g class="railroad-sequence"><ns0:g class="railroad-terminal" transform="translate(0, 20)"><ns0:rect x="0" y="0" width="88.0546875" height="39" rx="10" ry="10" /><ns0:text x="44.02734375" y="19.5">identifier</ns0:text></ns0:g><ns0:path class="railroad-line" d="M 88.0546875 39.5 L 98.0546875 39.5" /><ns0:g class="railroad-nonterminal" transform="translate(98.0546875, 20)"><ns0:rect x="0" y="0" width="95.703125" height="39" /><ns0:text x="47.8515625" y="19.5">expression</ns0:text></ns0:g><ns0:path class="railroad-line" d="M 193.7578125 39.5 L 203.7578125 39.5" /><ns0:g class="railroad-optional" transform="translate(203.7578125, 0)"><ns0:g class="railroad-terminal" transform="translate(20, 20)"><ns0:rect x="0" y="0" width="82.78125" height="39" rx="10" ry="10" /><ns0:text x="41.390625" y="19.5">operator</ns0:text></ns0:g><ns0:path class="railroad-line" d="M 0 39.5 L 20 39.5" /><ns0:path class="railroad-line" d="M 102.78125 39.5 L 122.78125 39.5" /><ns0:path class="railroad-line" d="M 0 39.5 A 10 10 0 0 0 10 29.5 L 10 10 A 10 10 0 0 1 20 0 L 102.78125 0 A 10 10 0 0 1 112.78125 10 L 112.78125 29.5 A 10 10 0 0 0 122.78125 39.5" /></ns0:g></ns0:g></ns0:g><ns0:g class="railroad-rule-name-group"><ns0:text class="railroad-rule-name" x="0" y="39.5">root =</ns0:text></ns0:g><ns0:g class="railroad-start"><ns0:circle cx="62.953125" cy="39.5" r="5" /></ns0:g><ns0:g class="railroad-end"><ns0:circle cx="419.4921875" cy="39.5" r="5" /></ns0:g><ns0:path class="railroad-line" d="M 67.953125 39.5 L 82.953125 39.5" /><ns0:path class="railroad-line" d="M 409.4921875 39.5 L 414.4921875 39.5" /></ns0:g><ns0:g class="railroad-rule" transform="translate(0, 97)"><ns0:g transform="translate(128.65625, 0.5)"><ns0:g class="railroad-terminal"><ns0:rect x="0" y="0" width="75.40625" height="39" rx="10" ry="10" /><ns0:text x="37.703125" y="19.5">number</ns0:text></ns0:g></ns0:g><ns0:g class="railroad-rule-name-group"><ns0:text class="railroad-rule-name" x="0" y="20">expression =</ns0:text></ns0:g><ns0:g class="railroad-start"><ns0:circle cx="108.65625" cy="20" r="5" /></ns0:g><ns0:g class="railroad-end"><ns0:circle cx="214.0625" cy="20" r="5" /></ns0:g><ns0:path class="railroad-line" d="M 113.65625 20 L 128.65625 20" /><ns0:path class="railroad-line" d="M 204.0625 20 L 209.0625 20" /></ns0:g></ns0:svg>