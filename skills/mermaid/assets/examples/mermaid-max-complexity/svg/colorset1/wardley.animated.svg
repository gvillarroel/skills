<svg xmlns="http://www.w3.org/2000/svg" id="my-svg" width="100%" style="max-width: 900px; background-color: white;" viewBox="0 0 900 600" role="graphics-document document" aria-roledescription="wardley" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg" data-animated-mermaid="true" data-animation="sequence" data-element-count="18"><title id="chart-title-my-svg">Wardley maximum complexity showcase</title><desc id="chart-desc-my-svg">A user value chain descends through interface, API, worker, database, and archive components while moving from genesis toward commodity evolution.</desc><g class="wardley-map"><rect class="wardley-background" width="900" height="600" fill="#ffffff" /><text class="wardley-title am-step am-role-label am-effect-fade" x="450" y="24" fill="#333e48" font-size="12.600000000000001" font-weight="bold" text-anchor="middle" dominant-baseline="middle" style="--am-delay: 815.000ms; --am-duration: 480.000ms; --am-easing: cubic-bezier(.2, .8, .2, 1); --am-draw-distance: 10000.0;">Wardley semantic roles</text><g class="wardley-axes"><line x1="48" x2="852" y1="552" y2="552" stroke="#696969" stroke-width="1" /><line x1="48" x2="48" y1="48" y2="552" stroke="#696969" stroke-width="1" /><text class="wardley-axis-label wardley-axis-label-x am-step am-role-label am-effect-fade" x="450" y="588" fill="#333e48" font-size="12" font-weight="bold" text-anchor="middle" style="--am-delay: 880.000ms; --am-duration: 480.000ms; --am-easing: cubic-bezier(.2, .8, .2, 1); --am-draw-distance: 10000.0;">Evolution</text><text class="wardley-axis-label wardley-axis-label-y am-step am-role-label am-effect-fade" x="16" y="300" fill="#333e48" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 16 300)" style="--am-delay: 945.000ms; --am-duration: 480.000ms; --am-easing: cubic-bezier(.2, .8, .2, 1); --am-draw-distance: 10000.0;">Visibility</text></g><g class="wardley-stages"><text class="wardley-stage-label am-step am-role-label am-eff