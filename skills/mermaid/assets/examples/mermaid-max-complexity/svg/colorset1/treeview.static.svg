:1;}#my-svg .node .neo-node{stroke:#9e1b32;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#9e1b32;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g class="tree-view"><g><text dominant-baseline="middle" class="treeView-node-label treeView-node-dir" x="5" y="14.5">/</text></g><line x1="-10" y1="14.5" x2="0" y2="14.5" stroke-width="1" class="treeView-node-line"/><g><text dominant-baseline="middle" class="treeView-node-label treeView-node-dir" x="20" y="43.5">skills-repository</text></g><line x1="5" y1="43.5" x2="15" y2="43.5" stroke-width="1" class="treeView-node-line"/><g><text dominant-baseline="middle" class="treeView-node-label treeView-node-dir" x="35" y="72.5">skills</text></g><line x1="20" y1="72.5" x2="30" y2="72.5" stroke-width="1" class="treeView-node-line"/><g><text dominant-baseline="middle" class="treeView-node-label treeView-node-dir" x="50" y="101.5">mermaid</text></g><line x1="35" y1="101.5" x2="45" y2="101.5" stroke-width="1" class="treeView-node-line"/><g><text dominant-baseline="middle" class="treeView-node-label" x="65" y=