<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" id="my-svg" width="100%" viewBox="0 0 800 450" style="max-width: 800px; background-color:white;" role="graphics-document document" aria-roledescription="venn" data-colorset="colorset2" data-palette-normalization="{&quot;#010101&quot;: &quot;#000000&quot;, &quot;#081005&quot;: &quot;#000000&quot;, &quot;#1b0509&quot;: &quot;#000000&quot;, &quot;#512801&quot;: &quot;#6d1222&quot;, &quot;#6b5506&quot;: &quot;#994a00&quot;, &quot;#b9b9b9&quot;: &quot;#b5b5b5&quot;}" aria-labelledby="mermaid-venn-colorset2-title" aria-describedby="mermaid-venn-colorset2-desc" data-category-presentation="solid-first"><ns0:title id="mermaid-venn-colorset2-title">Venn maximum complexity showcase</ns0:title><ns0:desc id="mermaid-venn-colorset2-desc">Eight named sets descend from value twelve to value five and consume every available Venn set color.</ns0:desc><ns0:style>#my-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333e48;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#e77204;}#my-svg .error-text{fill:#000000;stroke:#000000;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#696969;stroke:#696969;}#my-svg .marker.cross{stroke:#696969;}#my-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .venn-title{font-size:32px;fill:#333e48;font-family:"trebuchet ms",verdana,arial,sans-serif;}#my-svg .venn-circle text{font-size:48px;font-family:"trebuchet ms",verdana,arial,sans-serif;}#my-svg .venn-intersection text{font-size:48px;fill:#333e48;font-family:"trebuchet ms",verdana,arial,sans-serif;}#my-svg .venn-text-node{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333e48;}#my-svg .node .neo-node{stroke:#9e1b32;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#9e1b32;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</ns0:style><ns0:g /><ns0:text class="venn-title" font-size="16px" text-anchor="middle" dominant-baseline="middle" x="50%" y="16" style="fill:rgb(51, 62, 72);">Venn palette capacity</ns0:text><ns0:g transform="translate(0, 24)"><ns0:g class="venn-area venn-circle venn-set-0" data-venn-sets="S01"><ns0:path d="M 219.28908236901583 87.88432419025764 &#10;m -72.88432419025764 0 &#10;a 72.88432419025764 72.88432419025764 0 1 0 145.7686483805153 0 &#10;a 72.88432419025764 72.88432419025764 0 1 0 -145.7686483805153 0" style="fill-opacity: 0.1; fill:rgb(158, 27, 50); stroke:rgb(158, 27,