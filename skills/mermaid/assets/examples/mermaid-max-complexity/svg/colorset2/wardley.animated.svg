<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" id="my-svg" width="100%" style="max-width: 900px; background-color:white;" viewBox="0 0 900 600" role="graphics-document document" aria-roledescription="wardley" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg" data-colorset="colorset2" data-palette-normalization="{&quot;#666666&quot;: &quot;#696969&quot;, &quot;#cccccc&quot;: &quot;#cfcfcf&quot;, &quot;#eeeeee&quot;: &quot;#e7e7e7&quot;}" data-animated-mermaid="true" data-animation="sequence" data-element-count="18" data-category-presentation="solid-first" data-arrow-contrast="native-resting-3to1"><ns0:title id="chart-title-my-svg">Wardley maximum complexity showcase</ns0:title><ns0:desc id="chart-desc-my-svg">A user value chain descends through interface, API, worker, database, and archive components while moving from genesis toward commodity evolution.</ns0:desc><ns0:g class="wardley-map"><ns0:rect class="wardley-background" width="900" height="600" fill="#ffffff" /><ns0:text class="wardley-title am-step am-role-label am-effect-fade" x="450" y="24" fill="#333e48" font-size="12.600000000000001" font-weight="bold" text-anchor="middle" dominant-baseline="middle" style="--am-delay:815.000ms; --am-duration:480.000ms; --am-easing:cubic-bezier(.2, .8, .2, 1); --am-draw-distance:10000.0;">Wardley semantic roles</ns0:text><ns0:g class="wardley-axes"><ns0:line x1="48" x2="852" y1="552" y2="552" stroke="#696969" stroke-width="1" /><ns0:line x1="48" x2="48" y1="48" y2="552" stroke="#696969" stroke-width="1" /><ns0:text class="wardley-axis-label wardley-axis-label-x am-step am-role-label am-effect-fade" x="450" y="588" fill="#333e48" font-size="12" font-weight="bold" text-anchor="middle" style="--am-delay:880.000ms; --am-duration:480.000ms; --am-easing:cubic-bezier(.2, .8, .2, 1); --am-draw-distance:10000.0;">Evolution</ns0:text><ns0:text class="wardley-axis-label wardley-axis-label-y am-step am-role-label am-effect-fade" x="16" y="300" fill="#333e48" fo