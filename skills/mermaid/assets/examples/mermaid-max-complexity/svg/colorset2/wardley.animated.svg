6969" stroke-width="1" style="--am-delay:750.000ms; --am-duration:480.000ms; --am-easing:cubic-bezier(.2, .8, .2, 1); --am-draw-distance:10000.0; --am-grow-distance-a:6600.000; --am-grow-distance-b:2400.000; --am-grow-distance-c:360.000;stroke:#696969 !important;stroke-opacity:1 !important;" data-arrow-id="wardley-arrow-4" /></ns0:g><ns0:g class="wardley-trends" /><ns0:g class="wardley-nodes"><ns0:g class="am-wrapper am-step am-role-node am-effect-pop" style="--am-delay:100.000ms; --am-duration:480.000ms; --am-easing:cubic-bezier(.2, .8, .2, 1); --am-draw-distance:10000.0;"><ns0:g class="wardley-node wardley-node--anchor"><ns0:text x="811.8" y="70.20000000000005" class="wardley-node-label" fill="#000" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="middle">User</ns0:text></ns0:g></ns0:g><ns0:g class="am-wrapper am-step am-role-node am-effect-pop" style="--am-delay:165.000ms; --am-duration:480.000ms; --am-easing:cubic-bezier(.2, .8, .2, 1); --am-draw-distance:10000.0;"><ns0:g class="wardley-node wardley-node--component"><ns0:circle class="wardley-build-overlay" cx="707.28" cy="138.72000000000003" r="12" fill="#e7e7e7" stroke="#000" stroke-width="1" /><ns0:circle cx="707.28" cy="138.72000000000003" r="6" fill="#ffffff" stroke="#9e1b32" stroke-width="1" style="fill:#9e1b32 !important;fill-opacity:1 !important;opacity:1;stroke:none !important;stroke-width:0 !important;" /><ns0:text x="725.28" y="120.72000000000003" class="wardley-node-label" fill="#333e48" font-size="10" font-weight="normal" text-anchor="start" dominant-baseline="auto">Interface</ns0:text></ns0:g></ns0:g><ns0:g class="am-wrapper am-step am-role-node am-effect-pop" style="--am-delay:230.000ms; --am-duration:480.000ms; --am-easing:cubic-bezier(.2, .8, .2, 1); --am-draw-distance:10000.0;"><ns0:g class="wardley-node wardley-node--component"><ns0:circle class="wardley-build-overlay" cx="594.72" cy="209.27999999999997" r="12" fill="#e7e7e7" stroke="#000" stroke-width="1" /><ns0:circle cx="594.72" cy="209.27999999999997" r="6" fill="#ffffff" stroke="#9e1b32" stroke-width="1" style="fill:#007298 !important;fill-opacity:1 !important;opacity:1;stroke:none !important;stroke-width:0 !important;" /><ns0:text x="612.72" y="191.27999999999997" class="wardley-node-label" fill="#333e48" font-size="10" font-weight="normal" text-anchor="start" dominant-baseline="auto">API</ns0:text></ns0:g></ns0:g><ns0:g class="am-wrapper am-step am-role-node am-effect-pop" style="--am-delay:295.000ms; --am-duration:480.000ms; --am-easing:cubic-bezier(.2, .8, .2, 1); --am-draw-distance:10000.0;"><ns0:g class="wardley-node wardley-node--component"><ns0:circle class="wardley-build-overlay" cx="482.16" cy="279.84" r="12" fill="#e7e7e7" stroke="#000" stroke-width="1" /><ns0:circle cx="482.16" cy="279.84" r="6" fill="#ffffff" stroke="#9e1b32" stroke-width="1" style="fill:#e77204 !important;fill-opacity:1 !important;opacity:1;stroke:none !important;stroke-width:0 !important;" /><ns0:text x="500.16" y="261.84" class="wardley-node-label" fill="#333e48" font-size="10" font-weight="normal" text-anchor="start" dominant-baseline="auto">Worker</ns0:text></ns0:g></ns0:g><ns0:g class="am-wrapper am-step am-role-node am-effect-pop" style="--am-delay:360.000ms; --am-duration:480.000ms; --am-easing:cubic-bezier(.2, .8, .2, 1); --am-draw-distance:10000.0;"><ns0:g class="wardley-node wardley-node--component"><ns0:circle class="wardley-buy-overlay" cx="369.6" cy="350.4" r="12" fill="#cfcfcf" stroke="#9e1b32" stroke-width="1" /><ns0:circle cx="369.6" cy="350.4" r="6" fill="#ffffff" stroke="#9e1b32" stroke-width="1" style="fill:#45842a !important;fill-opacity:1 !important;opacity:1;stroke:none !important;stroke-width:0 !important;" /><ns0:text x="387.6" y="332.4" class="wardley-node-label" fill="#333e48" font-size="10" font-weight="normal" text-anchor="start" dominant-baseline="auto">Database</ns0:text></ns0:g></ns0:g><ns0:g class="am-wrapper am-step am-role-node am-effect-pop" style="--am-delay:425.000ms; --am-duration:480.000ms; --am-easing:cubic-bezier(.2, .8, .2, 1); --am-draw-distance:10000.0;"><ns0:g class="wardley-node wardley-node--component"><ns0:circle class="wardley-outsource-overlay" cx="249" cy="426" r="12" fill="#696969" stroke="#9e1b32" stroke-width="1" /><ns0:circle cx="249" cy="426" r="6" fill="#ffffff" stroke="#9e1b32" stroke-width="1" style="fill:#652f6c !important;fill-opacity:1 !important;opacity:1;stroke:none !important;stroke-width:0 !important;" /><ns0:text x="267" y="408" class="wardley-node-label" fill="#333e48" font-size="10" font-weight="normal" text-anchor="start" dominant-baseline="auto">Archive</ns0:text></ns0:g></ns0:g></ns0:g></ns0:g><ns0:defs><ns0:marker id="arrow-my-svg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><ns0:path d="M 0 0 L 10 5 L 0 10 z" fill="#e8002a" stroke="none" /></ns0:marker><ns0:marker id="link-arrow-end-my-svg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><ns0:path d="M 0 0 L 10 5 L 0 10 z" fill="#696969" stroke="none" /></ns0:marker><ns0:marker id="link-arrow-start-my-svg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto"><ns0:path d="M 10 0 L 0 5 L 10 10 z" fill="#696969" stroke="none" /></ns0:marker></ns0:defs><ns0:style id="animated-mermaid-style" type="text/css">
.am-step {
  animation-delay: var(--am-delay, 0ms);
  animation-duration: var(--am-duration, 650ms);
  animation-fill-mode: backwards;
  animation-timing-function: var(--am-easing, cubic-bezier(.2, .8, .2, 1));
  transform-box: fill-box;
  transform-origin: center;
}
.am-effect-fade { animation-name: am-fade; }
.am-effect-pop { animation-name: am-pop; }
.am-effect-slide-up { animation-name: am-slide-up; }
.am-effect-slide-left { animation-name: am-slide-left; }
.am-effect-zoom { animation-name: am-zoom; }
.am-effect-draw { animation-name: am-draw; }
.am-effect-radial-arrow,
.am-effect-grow-arrow {
  animation-name: am-grow-arrow;
  animation-timing-function: cubic-bezier(.16, .84, .28, 1);
  stroke-linecap: round;
  stroke-linejoin: round;
}
.am-effect-radial-arrow { animation-name: am-radial-arrow; }
@keyframes am-fade {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes am-pop {
  0% { opacity: 0; transform: scale(.92); }
  70% { opacity: 1; transform: scale(1.025); }
  100% { opacity: 1; transform: none; }
}
@keyframes am-slide-up {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}
@keyframes am-slide-left {
  from { opacity: 0; transform: translateX(18px); }
  to { opacity: 1; transform: none; }
}
@keyframes am-zoom {
  from { opacity: 0; transform: scale(.86); }
  to { opacity: 1; transform: none; }
}
@keyframes am-draw {
  from {
    opacity: 0;
    stroke-dasharray: var(--am-draw-distance, 10000);
    stroke-dashoffset: var(--am-draw-distance, 10000);
  }
  12% { opacity: 1; }
  to {
    opacity: 1;
    stroke-dasharray: var(--am-draw-distance, 10000);
    stroke-dashoffset: 0;
  }
}
@keyframes am-grow-arrow {
  0% {
    opacity: 0;
    marker-start: none;
    marker-mid: none;
    marker-end: none;
    stroke-dasharray: var(--am-draw-distance, 10000);
    stroke-dashoffset: var(--am-draw-distance, 10000);
  }
  8% {
    opacity: 1;
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
  }
  34% {
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
    stroke-dasharray: var(--am-draw-distance, 10000);
    stroke-dashoffset: var(--am-grow-distance-a, 6600);
  }
  62% {
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
    stroke-dashoffset: var(--am-grow-distance-b, 2400);
  }
  84% {
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
    stroke-dashoffset: var(--am-grow-distance-c, 360);
  }
  100% {
    opacity: 1;
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
    stroke-dasharray: var(--am-draw-distance, 10000);
    stroke-dashoffset: 0;
  }
}
@keyframes am-radial-arrow {
  0% {
    opacity: 0;
    marker-start: none;
    marker-mid: none;
    marker-end: none;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
  }
  10% {
    opacity: 1;
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
  }
  38% {
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
    stroke-dasharray: 1;
    stroke-dashoffset: .66;
  }
  66% {
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
    stroke-dashoffset: .24;
  }
  86% {
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
    stroke-dashoffset: .05;
  }
  100% {
    opacity: 1;
    marker-start: var(--am-marker-start, none);
    marker-mid: var(--am-marker-mid, none);
    marker-end: var(--am-marker-end, none);
    stroke-dasharray: 1;
    stroke-dashoffset: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  .am-step {
    animation: none !important;
    opacity: initial !important;
    transform: none !important;
    stroke-dasharray: initial !important;
    stroke-dashoffset: initial !important;
  }
}
</ns0:style></ns0:svg>
