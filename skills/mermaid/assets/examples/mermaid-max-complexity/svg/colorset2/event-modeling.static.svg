de path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#9e1b32;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g class="em-swimlane"><rect x="0" y="0" rx="3" width="1038" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"/><text font-weight="bold" x="30" y="30">UI/Automation</text></g><g class="em-swimlane"><rect x="0" y="140" rx="3" width="1038" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"/><text font-weight="bold" x="30" y="170">Command/Read Model</text></g><g class="em-swimlane"><rect x="0" y="280" rx="3" width="1038" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"/><text font-weight="bold" x="30" y="310">Events</text></g><g class="em-box"><rect x="250" y="15" rx="3" width="204" height="100" stroke="#9c9c9c" fill="#ffffff"/><foreignObject x="260" y="25" width="184" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; height: 100%; width: 100%;"><span style="display: table-cell; text-align: center; vertical-align: middle;"><b>UserInterface</b></span></div></foreignObject></g><g class="em-box"><rect x="464" y="15" rx="3" width="175" height="100" stroke="#652f6c" fill="#f9ccff"/><foreignObject x="474" y="25" width="155" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; height: 100%; width: 100%;"><span style="display: table-cell; text