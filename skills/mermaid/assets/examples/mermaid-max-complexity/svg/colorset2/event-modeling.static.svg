<ns0:svg xmlns:html="http://www.w3.org/1999/xhtml" xmlns:ns0="http://www.w3.org/2000/svg" id="my-svg" width="100%" style="max-width: 1098px; background-color:white;" viewBox="-30 -30 1098 470" role="graphics-document document" aria-roledescription="eventmodeling" data-colorset="colorset2" data-palette-normalization="{&quot;#b9b9b9&quot;: &quot;#b5b5b5&quot;, &quot;#f0f0f0&quot;: &quot;#f7f7f7&quot;, &quot;#fafafa&quot;: &quot;#f7f7f7&quot;}" aria-labelledby="mermaid-event-modeling-colorset2-title" aria-describedby="mermaid-event-modeling-colorset2-desc" data-category-presentation="solid-first" data-arrow-contrast="native-resting-3to1"><ns0:title id="mermaid-event-modeling-colorset2-title">Event Modeling maximum complexity showcase</ns0:title><ns0:desc id="mermaid-event-modeling-colorset2-desc">One timeline frame each represents a user interface, processor, read model, command, and event role.</ns0:desc><ns0:style>#my-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333e48;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#e77204;}#my-svg .error-text{fill:#000000;stroke:#000000;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#696969;stroke:#696969;}#my-svg .marker.cross{stroke:#696969;}#my-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .node .neo-node{stroke:#9e1b32;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#9e1b32;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</ns0:style><ns0:g /><ns0:g class="em-swimlane"><ns0:rect x="0" y="0" rx="3" width="1038" height="130" fill="#f7f7f7" stroke="#f7f7f7" /><ns0:text font-weight="bold" x="30" y="30" style="fill:#000000 !important;color:#000000 !important;">UI/Automation</ns0:text></ns0:g><ns0:g class="em-swimlane"><ns0:rect x="0" y="140" rx="3" width="1038" height="130" fill="#f7f7f7" stroke="#f7f7f7" /><ns0:text font-weight="bold" x="30" y="170" style="fill:#000000 !important;color:#000000 !important;">Command/Read Model</ns0:text></ns0:g><ns0:g class="em-swimlane"><ns0:rect x="0" y="280" rx="3" width="1038" height="130" fill="#f7f7f7" stroke="#f7f7f7" /><ns0:text font-weight="bold" x="30" y="310" style="fill:#000000 !important;color:#000000 !important;">Events</ns0:text></ns0:g><ns0:g class="em-box"><ns0:rect x="250" y="15" rx="3" width="204" height="100" stroke="#9e1b32" fill="#9e1b32" style="fill:#9e1b32 !important;fill-opacity:1 !important;opacity:1;stroke:none