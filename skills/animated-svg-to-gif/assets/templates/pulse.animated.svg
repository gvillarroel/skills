<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" data-colorset="colorset1" data-style-policy="solid-fill-no-outline" aria-label="Pulse animation">
  <style>
    :root { --am-duration: 2s; }
    .pulse { transform-origin: 180px 112px; animation: pulse-scale 2s ease-in-out infinite; }
    @keyframes pulse-scale {
      0%, 100% { transform: scale(0.82); }
      50% { transform: scale(1.08); }
    }
  </style>
  <rect width="360" height="240" fill="#ffffff"/>
  <circle class="pulse" cx="180" cy="112" r="46" fill="#9e1b32" stroke="none"/>
  <text x="180" y="194" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="24" fill="#000000">Pulse</text>
</svg>
