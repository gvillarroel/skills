<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chart</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;color:var(--color-text-primary,#333e48);background:var(--color-background-primary,#f7f7f7)}*{box-sizing:border-box}body{margin:0;padding:16px}main{max-width:1800px;margin:auto}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}header{display:flex;justify-content:flex-end;margin-bottom:8px}header:has(button[hidden]){margin:0}p{color:var(--color-text-secondary,#4f4f4f);font-size:13px;line-height:1.5;margin:8px 0}
button,summary,select{font:inherit;font-size:14px;min-height:44px;min-width:44px;border:1px solid var(--color-border-primary,#828282);border-radius:8px;padding:11px 15px;background:var(--color-background-primary,#f7f7f7);color:inherit;cursor:pointer}button.primary{background:#9e1b32;color:#ffffff;border-color:#9e1b32}button:disabled,select:disabled{opacity:.5;cursor:wait}button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #9e1b32;outline-offset:3px}
#viewport{position:relative;border:1px solid var(--color-border-primary,#828282);border-radius:10px;overflow:auto;background:#f7f7f7;min-height:260px}iframe{display:block;border:0;width:100%;min-width:280px}iframe[data-inactive=true]{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none}#preview{display:block;width:100%;height:auto}#status{padding:4px 0}#error{padding:10px;border:1px solid #9e1b32;border-radius:8px;color:#9e1b32;white-space:pre-wrap}.actions{display:flex;align-items:start;flex-wrap:wrap;gap:8px;margin-top:12px}#advanced-panel{border-top:1px solid var(--color-border-primary,#828282);margin-top:14px;padding-top:16px;display:grid;gap:22px}fieldset{border:0;padding:0;margin:0;min-width:0}legend{font-size:14px;font-weight:600;margin:0 0 10px;padding:0}.display-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field-label{display:grid;gap:7px;font-size:14px;min-width:0}select{width:100%;max-width:100%}.check-label{grid-column:1/-1;display:flex;align-items:center;gap:10px;min-height:44px;width:fit-content;font-size:14px;cursor:pointer}.check-label input{width:20px;height:20px;accent-color:#9e1b32}.export-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}.export-help{max-width:72ch;font-size:12px}[hidden]{display:none!important}@media(max-width:480px){body{padding:10px}button,summary,select{padding:11px 13px}.display-controls{grid-template-columns:1fr}.export-controls{gap:8px}}
</style></head>
<body><main aria-busy="true">
<header><h1 id="title" class="sr-only">Creating chart…</h1><button id="expand" type="button" hidden>Expand</button></header>
<p id="status" role="status" aria-live="polite">Connecting…</p><p id="error" role="alert" hidden></p>
<div id="viewport"><iframe id="chart" title="Interactive chart" sandbox="allow-scripts allow-downloads" referrerpolicy="no-referrer" hidden></iframe><img id="preview" alt="Chart image" hidden></div>
<div class="actions"><button id="save-image" class="primary" type="button" title="Save the original chart as a PNG image" disabled>Save image</button>
<button id="more-summary" type="button" aria-expanded="false" aria-controls="advanced-panel">More options<span class="sr-only"> for display, export and data</span></button></div>
<section id="advanced-panel" aria-labelledby="more-summary" hidden>
<fieldset><legend>Display</legend><div class="display-controls">
<label class="field-label">Palette<select id="palette-select" disabled><option value="colorset1">Colorset 1</option><option value="colorset2">Colorset 2</option></select></label>
<label class="field-label">View<select id="view-select" disabled><option value="interactive">Interactive</option><option value="svg">Image</option></select></label>
<label class="check-label"><input id="chart-tools" type="checkbox" disabled>Show chart tools</label>
</div></fieldset>
<fieldset><legend>Export</legend><div class="export-controls">
<label class="field-label">Format<select id="export-format" disabled><option value="svg">SVG — scalable image</option><option value="html">HTML — interactive chart</option><option value="source">Python — editable source</option><option value="spec">JSON — chart specification</option></select></label>
<button id="download-format" type="button" disabled>Download</button></div><p id="export-help" class="export-help"></p><p id="expiry" class="export-help"></p><p id="warnings" class="export-help" hidden></p></fieldset>
<details id="data-editor"><summary>Edit chart data</summary><p id="data-help">Edit the JSON chart specification, then apply it. Applying changes keeps your last valid chart if a request fails.</p><label class="field-label" for="spec-editor">Chart specification (JSON)</label><textarea id="spec-editor" rows="12" spellcheck="false" aria-describedby="data-help" style="width:100%;max-width:100%;padding:12px;font:13px/1.5 ui-monospace,monospace;background:var(--color-background-primary,#f7f7f7);color:inherit;border:1px solid var(--color-border-primary,#828282);border-radius:8px;resize:vertical"></textarea><button id="apply-data" type="button" disabled>Apply data</button></details>
</section>
</main><script>/*__WIDGET_BUNDLE__*/</script></body></html>
