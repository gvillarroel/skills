<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Una skill convierte a Codex en especialista</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f7f7f7; }
    body { display: grid; place-items: center; font-family: "Open Sans", Arial, sans-serif; }
    #stage { width: 1280px; height: 720px; display: block; background: #f7f7f7; }
    foreignObject img.semantic-asset { display: block; width: 100%; height: 100%; object-fit: contain; }
    text { font-family: "Open Sans", Arial, sans-serif; }
  </style>
</head>
<body>
  <svg id="stage" viewBox="0 0 1280 720" role="img" aria-label="Explainer visual de una skill reutilizable de Codex"></svg>
  <script>
    const NS = "http://www.w3.org/2000/svg";
    const stage = document.getElementById("stage");
    const palette = {
      page: "#f7f7f7", white: "#ffffff", ink: "#333e48", red: "#9e1b32",
      alert: "#e8002a", g100: "#e7e7e7", g200: "#cfcfcf", g300: "#b5b5b5",
      g400: "#9c9c9c", g500: "#828282", g600: "#696969", g800: "#363636"
    };
    const SCENES = [
      { id: "s01", beat: 1, start: 0, end: 5, assetId: "a01-prompt-wall", assetSrc: "artifacts/images/a01-prompt-wall.svg", mediaSrc: "../artifacts/images/a01-prompt-wall.svg", sha256: "c14ad97de83175d97d107e88c05b3a4a79733dd8b45ecb3d6259475f29ac5745", layout: { x: 64, y: 54, w: 1088, h: 612 }, packet: [336, 300], status: "3 tareas · mismo prompt · contexto lleno", anchor: "repeated prompt workflow" },
      { id: "s02", beat: 2, start: 5, end: 13, assetId: "a02-skill-package", assetSrc: "artifacts/images/a02-skill-package.svg", mediaSrc: "../artifacts/images/a02-skill-package.svg", sha256: "5a5aacf84cb9f3f6acc4e2c307a1da44268b8a5f7b0277b5b9347b47148bdd7c", layout: { x: 192, y: 108, w: 896, h: 504 }, packet: [28, 286], status: "SKILL.md · instrucciones + recursos", anchor: "SKILL.md" },
      { id: "s03", beat: 3, start: 13, end: 22, assetId: "a03-progressive-disclosure", assetSrc: "artifacts/images/a03-progressive-disclosure.svg", mediaSrc: "../artifacts/images/a03-progressive-disclosure.svg", sha256: "60f14e3d4a1b46642f8be9067f984a78e726398541f97a94de04ae7a11a00fa8", layout: { x: 96, y: 72, w: 1024, h: 576 }, packet: [272, 28], status: "Núcleo + 1 referencia · resto fuera", anchor: "progressive disclosure" },
      { id: "s04", beat: 4, start: 22, end: 31, assetId: "a04-resource-bundle", assetSrc: "artifacts/images/a04-resource-bundle.svg", mediaSrc: "../artifacts/images/a04-resource-bundle.svg", sha256: "bfe9805ac806e26bba2013ee246c647ece6670c9e20ddabf1541ad50ab16c613", layout: { x: 64, y: 54, w: 1088, h: 612 }, packet: [28, 306], status: "Criterio + ejecución + material → video", anchor: "references scripts assets" },
      { id: "s05", beat: 5, start: 31, end: 41, assetId: "a05-specialist-router", assetSrc: "artifacts/images/a05-specialist-router.svg", mediaSrc: "../artifacts/images/a05-specialist-router.svg", sha256: "954e275e068f49dea173c318046f1710ca0be66b05e40850ecb703013b5707ff", layout: { x: 64, y: 54, w: 1088, h: 612 }, packet: [280, 298], status: "Necesidad visual → productor → artefacto", anchor: "Mermaid D3 ImageGen" },
      { id: "s06", beat: 6, start: 41, end: 51, assetId: "a06-validation-gate", assetSrc: "artifacts/images/a06-validation-gate.svg", mediaSrc: "../artifacts/images/a06-validation-gate.svg", sha256: "c945b58844b4633d9ba52d32c93e2df6767ce04b4add27b5d94783bfe8b70e29", layout: { x: 128, y: 72, w: 1024, h: 576 }, packet: [24, 24], status: "Artefacto → controles → corregir → listo", anchor: "validation as part of the work" },
      { id: "s07", beat: 7, start: 51, end: 61, assetId: "a07-context-budget", assetSrc: "artifacts/images/a07-context-budget.svg", mediaSrc: "../artifacts/images/a07-context-budget.svg", sha256: "aae8f1c8c0f8eb2751edbabc4ffa5c63f8c250e78dcce5a9f9a5ec129196e9fb", layout: { x: 64, y: 54, w: 1088, h: 612 }, packet: [506, 244], status: "Prompt siempre | skill bajo demanda", anchor: "on-demand reusable workflow" },
      { id: "s08", beat: 8, start: 61, end: 70, assetId: "a08-reusable-workflow", assetSrc: "artifacts/images/a08-reusable-workflow.svg", mediaSrc: "../artifacts/images/a08-reusable-workflow.svg", sha256: "5e1a40d5bdfdbe3c6b1826743c047c166e856dd70d27b561568e768eb4ae981d", layout: { x: 192, y: 90, w: 896, h: 504 }, packet: [284, 36], status: "Una skill · cuatro proyectos · mismo workflow", anchor: "reusable Codex skill" }
    ];

    const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
    const ease = (v) => { const t = clamp(v); return t * t * (3 - 2 * t); };
    const mix = (a, b, t) => a + (b - a) * ease(t);

    function el(name, attrs = {}, parent = stage) {
      const node = document.createElementNS(NS, name);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, String(value));
      parent.appendChild(node);
      return node;
    }

    function label(x, y, value, size = 18, fill = palette.ink, weight = 700, anchor = "start", parent = stage) {
      const node = el("text", { x, y, "font-size": size, fill, "font-weight": weight, "text-anchor": anchor }, parent);
      node.textContent = value;
      return node;
    }

    function sceneAt(seconds) {
      const safe = clamp(Number(seconds) || 0, 0, 69.999);
      const index = Math.max(0, SCENES.findIndex((scene) => safe >= scene.start && safe < scene.end));
      const scene = SCENES[index];
      return { scene, index, seconds: safe, progress: clamp((safe - scene.start) / (scene.end - scene.start)) };
    }

    function sx(scene, x) { return scene.layout.x + x * scene.layout.w / 640; }
    function sy(scene, y) { return scene.layout.y + y * scene.layout.h / 360; }
    function sw(scene, w) { return w * scene.layout.w / 640; }
    function sh(scene, h) { return h * scene.layout.h / 360; }

    function mappedRect(scene, x, y, w, h, attrs = {}, parent = stage) {
      return el("rect", { x: sx(scene, x), y: sy(scene, y), width: sw(scene, w), height: sh(scene, h), ...attrs }, parent);
    }

    function mappedLine(scene, x1, y1, x2, y2, attrs = {}, parent = stage) {
      return el("line", { x1: sx(scene, x1), y1: sy(scene, y1), x2: sx(scene, x2), y2: sy(scene, y2), ...attrs }, parent);
    }

    function mappedText(scene, x, y, value, size = 13, attrs = {}, parent = stage) {
      return label(sx(scene, x), sy(scene, y), value, size * scene.layout.w / 640, attrs.fill || palette.ink, attrs.weight || 700, attrs.anchor || "start", parent);
    }

    function drawBackdrop() {
      el("rect", { width: 1280, height: 720, fill: palette.page });
      el("rect", { x: 36, y: 36, width: 1208, height: 648, fill: "none", stroke: palette.g200, "stroke-width": 2 });
      [[36, 36], [1228, 36], [36, 668], [1228, 668]].forEach(([x, y]) => {
        el("rect", { x, y, width: 16, height: 16, fill: palette.red });
      });
    }

    function drawBoundAsset(scene) {
      const frame = el("foreignObject", {
        x: scene.layout.x, y: scene.layout.y, width: scene.layout.w, height: scene.layout.h,
        "data-composition-id": scene.id, class: "is-visible"
      });
      const image = document.createElementNS("http://www.w3.org/1999/xhtml", "img");
      image.setAttribute("src", scene.mediaSrc);
      image.setAttribute("alt", "");
      image.setAttribute("class", "semantic-asset is-visible");
      image.setAttribute("data-asset-id", scene.assetId);
      image.setAttribute("data-asset-src", scene.assetSrc);
      image.setAttribute("data-asset-sha256", scene.sha256);
      image.setAttribute("data-object-id", scene.id + "-focal");
      image.setAttribute("data-role", "focal");
      frame.appendChild(image);
      return frame;
    }

    function drawSkillPacket(scene, progress) {
      const [px, py] = scene.packet;
      const x = sx(scene, px), y = sy(scene, py), w = sw(scene, 72), h = sh(scene, 36);
      const pulse = 1 + 0.035 * Math.sin(progress * Math.PI * 4);
      const group = el("g", { transform: `translate(${x + w / 2} ${y + h / 2}) scale(${pulse}) translate(${-x - w / 2} ${-y - h / 2})` });
      el("rect", { x, y, width: w, height: h, fill: palette.red, "data-object-id": scene.id + "-support", "data-role": "support", "data-composition-id": scene.id, class: "is-visible" }, group);
      el("path", { d: `M${x + w - 18} ${y}H${x + w}V${y + 18}Z`, fill: palette.white }, group);
      label(x + w / 2, y + h * 0.68, "SKILL", Math.max(12, h * 0.36), palette.white, 800, "middle", group);
      return { x, y, w, h };
    }

    function drawStatus(scene) {
      el("rect", { x: 64, y: 668, width: 12, height: 12, fill: palette.red });
      label(88, 681, scene.status, 17, palette.ink, 800);
    }

    function drawPromptCopies(scene, p) {
      const count = Math.min(3, Math.floor(clamp(p / 0.62) * 4));
      for (let i = 0; i < count; i++) {
        mappedRect(scene, 30, 52 + i * 88, 300, 76, { fill: "none", stroke: i === count - 1 ? palette.red : palette.g400, "stroke-width": 4 });
      }
      const travel = ease((p - 0.18) / 0.55);
      const x = mix(334, 406, travel), y = mix(142, 162, travel);
      mappedRect(scene, x, y, 44, 58, { fill: palette.white, stroke: palette.red, "stroke-width": 3 });
      for (let i = 0; i < 3; i++) mappedLine(scene, x + 8, y + 14 + i * 12, x + 34, y + 14 + i * 12, { stroke: palette.g600, "stroke-width": 3 });
      if (p > 0.72) {
        mappedRect(scene, 448, 234, 140, 56, { fill: "none", stroke: palette.alert, "stroke-width": 5 });
      }
      return 1 + count + (p > 0.72 ? 1 : 0);
    }

    function drawPackageAssembly(scene, p) {
      const n = Math.min(3, Math.floor(clamp((p - 0.16) / 0.64) * 4));
      const slots = [[494, 112], [494, 212], [494, 306]];
      slots.slice(0, n).forEach(([x, y], i) => {
        mappedRect(scene, x - 6, y - 6, 122, 72, { fill: "none", stroke: palette.red, "stroke-width": 4 - i * 0.4 });
      });
      const travel = ease((p - 0.05) / 0.35);
      mappedLine(scene, 156, 176, mix(164, 238, travel), 176, { stroke: palette.red, "stroke-width": 7 });
      return 2 + n;
    }

    function drawSelectedReference(scene, p) {
      const t = ease((p - 0.18) / 0.58);
      const x = mix(470, 360, t), y = mix(128, 284, t);
      mappedRect(scene, x, y, 112, 42, { fill: palette.white, stroke: palette.red, "stroke-width": 4 });
      mappedText(scene, x + 56, y + 26, "video-validation.md", 9, { weight: 800, anchor: "middle" });
      mappedLine(scene, 522, 176, 522, mix(176, 236, t), { stroke: palette.red, "stroke-width": 5 });
      mappedLine(scene, 522, 236, mix(522, 414, t), 236, { stroke: palette.red, "stroke-width": 5 });
      return 2 + (p > 0.18 ? 1 : 0) + (p > 0.72 ? 1 : 0);
    }

    function drawResourceWorkstations(scene, p) {
      const active = Math.min(3, Math.floor(clamp(p / 0.72) * 4));
      [116, 320, 524].forEach((x, i) => {
        if (i < active) {
          mappedRect(scene, x - 58, 176, 116, 72, { fill: "none", stroke: palette.red, "stroke-width": 4 });
          mappedLine(scene, x - 14, 226, x - 2, 238, { stroke: palette.red, "stroke-width": 5 });
          mappedLine(scene, x - 2, 238, x + 24, 208, { stroke: palette.red, "stroke-width": 5 });
        }
      });
      const build = ease((p - 0.55) / 0.3);
      mappedRect(scene, 234, 306, 172 * build, 42, { fill: palette.ink, opacity: 0.18 + build * 0.82 });
      return 1 + active + (p > 0.55 ? 1 : 0);
    }

    function drawSpecialistRoute(scene, p) {
      const branch = Math.min(2, Math.floor(p * 3));
      const rows = [34, 137, 240];
      rows.forEach((y, i) => {
        mappedRect(scene, 338, y - 4, 278, 94, { fill: "none", stroke: i === branch ? palette.red : palette.g300, "stroke-width": i === branch ? 5 : 2, opacity: i === branch ? 1 : 0.45 });
      });
      const targetY = rows[branch] + 43;
      mappedLine(scene, 286, 180, 326, targetY, { stroke: palette.red, "stroke-width": 7 });
      const t = (p * 3) % 1;
      const x = mix(286, 326, t), y = mix(180, targetY, t);
      mappedRect(scene, x - 7, y - 7, 14, 14, { fill: palette.alert });
      return 3 + branch;
    }

    function drawValidationRetry(scene, p) {
      let x, y;
      if (p < 0.42) {
        const t = ease(p / 0.42); x = mix(110, 288, t); y = 168;
      } else if (p < 0.62) {
        const t = ease((p - 0.42) / 0.20); x = mix(288, 166, t); y = mix(168, 278, t);
      } else {
        const t = ease((p - 0.62) / 0.38); x = mix(166, 574, t); y = mix(278, 168, t);
      }
      mappedRect(scene, x - 22, y - 16, 44, 32, { fill: palette.white, stroke: p < 0.62 ? palette.alert : palette.red, "stroke-width": 4 });
      mappedRect(scene, x - 14, y - 8, 28, 16, { fill: palette.g300 });
      if (p > 0.42 && p < 0.62) {
        mappedLine(scene, 182, 266, 208, 292, { stroke: palette.alert, "stroke-width": 6 });
        mappedLine(scene, 208, 266, 182, 292, { stroke: palette.alert, "stroke-width": 6 });
      }
      return p < 0.42 ? 2 : p < 0.62 ? 3 : 5;
    }

    function drawContextComparison(scene, p) {
      const top = ease(p / 0.55), bottom = ease((p - 0.22) / 0.48);
      mappedRect(scene, 24, 42, 286, 258, { fill: "none", stroke: palette.alert, "stroke-width": 3 + 3 * top, opacity: 0.24 + 0.76 * top });
      mappedRect(scene, 330, 42, 286, 258, { fill: "none", stroke: palette.red, "stroke-width": 3 + 3 * bottom, opacity: 0.24 + 0.76 * bottom });
      if (p > 0.68) mappedRect(scene, 22, 310, 278, 34, { fill: "none", stroke: palette.alert, "stroke-width": 5 });
      return 2 + (p > 0.22 ? 1 : 0) + (p > 0.68 ? 1 : 0);
    }

    function drawProjectReuse(scene, p) {
      const points = [[196, 92], [444, 92], [196, 279], [444, 279]];
      const active = Math.min(3, Math.floor(p * 4));
      points.forEach(([x, y], i) => {
        const on = i <= active;
        mappedRect(scene, x - 9, y - 9, 18, 18, { fill: on ? palette.alert : palette.g300 });
        if (on) {
          mappedLine(scene, x - 12, y + 26, x - 2, y + 36, { stroke: palette.red, "stroke-width": 4 });
          mappedLine(scene, x - 2, y + 36, x + 18, y + 12, { stroke: palette.red, "stroke-width": 4 });
        }
      });
      return 2 + active;
    }

    const OVERLAYS = {
      s01: drawPromptCopies, s02: drawPackageAssembly, s03: drawSelectedReference,
      s04: drawResourceWorkstations, s05: drawSpecialistRoute, s06: drawValidationRetry,
      s07: drawContextComparison, s08: drawProjectReuse
    };

    function drawTransitionPacket(x, y, w, h, opacity = 1) {
      const group = el("g", { opacity });
      el("rect", { x, y, width: w, height: h, fill: palette.red }, group);
      el("path", { d: `M${x + w - 12} ${y}H${x + w}V${y + 12}Z`, fill: palette.white }, group);
      label(x + w / 2, y + h * 0.68, "SKILL", Math.max(10, h * 0.34), palette.white, 800, "middle", group);
    }

    function drawTransitionCue(scene, p, packet) {
      const outgoing = ease((p - 0.86) / 0.14);
      const incoming = ease(p / 0.14);
      const w = Math.min(packet.w * 0.82, 74), h = Math.min(packet.h * 0.82, 38);
      if (outgoing > 0) {
        const x = mix(packet.x + (packet.w - w) / 2, 1244 - w, outgoing);
        const y = packet.y + (packet.h - h) / 2;
        drawTransitionPacket(x, y, w, h, 0.88);
      } else if (p < 0.14) {
        const x = mix(36 - w, packet.x + (packet.w - w) / 2, incoming);
        const y = packet.y + (packet.h - h) / 2;
        drawTransitionPacket(x, y, w, h, 0.88);
      }
    }

    window.renderConceptFrame = function renderConceptFrame(videoId, seconds, options = {}) {
      const timeline = sceneAt(seconds);
      const { scene, index, progress } = timeline;
      stage.replaceChildren();
      drawBackdrop();
      drawBoundAsset(scene);
      const visibleMechanismCount = OVERLAYS[scene.id](scene, progress);
      const packet = drawSkillPacket(scene, progress);
      drawTransitionCue(scene, progress, packet);
      drawStatus(scene);
      const zoneIndex = progress < 0.28 ? 0 : progress < 0.72 ? 1 : 2;
      stage.setAttribute("data-active-scene-id", scene.id);
      stage.setAttribute("data-active-composition-id", scene.id);
      stage.setAttribute("data-visual-pattern", "semantic-skill-workflow");
      return {
        videoId,
        seconds: timeline.seconds,
        beat: scene.beat,
        activeBeat: scene.beat,
        sceneId: scene.id,
        activeSceneId: scene.id,
        activeCompositionId: scene.id,
        activeAssetIds: [scene.assetId],
        sourceProofAssetIds: [scene.assetId],
        visualPattern: "semantic-skill-workflow",
        visibleMechanismCount,
        hookVisible: index === 0,
        sourceProofVisible: true,
        transitionVisible: progress < 0.14 || progress > 0.86,
        warningVisible: scene.id === "s07" && progress > 0.68,
        outputVisible: scene.id === "s08" && progress > 0.52,
        finalCallbackVisible: scene.id === "s08" && progress > 0.72,
        sceneProgress: progress,
        activeZoneIndex: zoneIndex,
        activeZoneId: `${scene.id}-${["input", "process", "output"][zoneIndex]}`,
        visibleZoneCount: 3,
        activeSourceAnchors: ["SKILL.md", scene.anchor],
        cameraX: 0,
        cameraY: 0,
        cameraScale: 1,
        cameraMoving: false
      };
    };

    window.renderConceptFrame("skill-convierte-codex-especialista", 0, { capture: false });
  </script>
</body>
</html>
