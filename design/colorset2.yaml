metadata:
  name: "full-color-style"
  description: "Style using the full color palette. All color values are explicit and do not reference other tokens."

typography:
  primary:
    value: "'Open Sans', Arial, sans-serif"
    use: "Primary font for text and interface components."

iconography:
  primary:
    value: "'Material Symbols Rounded'"
    use: "Font used for system icons."

colors:
  brand:
    primary:
      value: "#9e1b32"
      use: "Brand identity, headers, navigation, and prominent elements."
    neutral:
      value: "#333e48"
      use: "Primary text, dark backgrounds, and institutional elements."

  primary:
    red:
      value: "#9e1b32"
      use: "Primary actions, prominent elements, and visual emphasis."
    orange:
      value: "#e77204"
      use: "Categories, charts, and highlighted secondary elements."
    yellow:
      value: "#f1c319"
      use: "Attention indicators, categories, and informational elements."
    green:
      value: "#45842a"
      use: "Positive actions, categories, and charts."
    blue:
      value: "#007298"
      use: "Links, informational actions, and interactive elements."
    purple:
      value: "#652f6c"
      use: "Categories, charts, and special visual elements."
    black:
      value: "#000000"
      use: "Text or elements requiring maximum contrast."
    white:
      value: "#ffffff"
      use: "Light backgrounds and content displayed on dark surfaces."
    gray:
      value: "#333e48"
      use: "Primary text, neutral surfaces, and dark interface areas."

  gray:
    "100":
      value: "#e7e7e7"
      use: "Subtle backgrounds and low-emphasis separators."
    "200":
      value: "#cfcfcf"
      use: "Disabled states, light borders, and focus indicators."
    "300":
      value: "#b5b5b5"
      use: "Low-priority neutral elements."
    "400":
      value: "#9c9c9c"
      use: "Standard borders and dividers."
    "500":
      value: "#828282"
      use: "Secondary text and neutral elements."
    "600":
      value: "#696969"
      use: "Dark borders and higher-contrast secondary text."
    "700":
      value: "#4f4f4f"
      use: "High-priority text and dark surfaces."
    "800":
      value: "#363636"
      use: "Dark backgrounds and high-contrast text."
    "900":
      value: "#1c1c1c"
      use: "Very dark surfaces and maximum neutral emphasis."

  interaction:
    red:
      value: "#6d1222"
      use: "Hover, active, or pressed state for red elements."
    orange:
      value: "#994a00"
      use: "Hover, active, or pressed state for orange elements."
    yellow:
      value: "#98700c"
      use: "Hover, active, or pressed state for yellow elements."
    green:
      value: "#294d19"
      use: "Hover, active, or pressed state for green elements."
    blue:
      value: "#004d66"
      use: "Hover, active, or pressed state for blue elements."
    purple:
      value: "#431f47"
      use: "Hover, active, or pressed state for purple elements."

  highlight:
    red:
      value: "#ffccd5"
      use: "Subtle background for errors, critical alerts, or highlighted content."
    orange:
      value: "#ffe5cc"
      use: "Subtle background for warnings."
    yellow:
      value: "#fff4cc"
      use: "Subtle background for caution or pending states."
    green:
      value: "#dbffcc"
      use: "Subtle background for success messages."
    blue:
      value: "#cdf3ff"
      use: "Subtle background for information and contextual help."
    purple:
      value: "#f9ccff"
      use: "Subtle background for special or custom states."

  status:
    error:
      value: "#e8002a"
      use: "Errors, destructive actions, and critical alerts."
    warning:
      value: "#ff9633"
      use: "Warnings and situations requiring attention."
    caution:
      value: "#ffd332"
      use: "Caution messages, pending processes, and notices."
    success:
