<svg xmlns="http://www.w3.org/2000/svg" id="my-svg" width="100%" viewBox="0 0 598 450" style="max-width: 598px; background-color:white;" role="graphics-document document" aria-roledescription="pie" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg" data-category-presentation="solid-first" data-colorset="colorset1" data-palette-normalization="{&quot;#b9b9b9&quot;: &quot;#b5b5b5&quot;}" data-video-style="line-world" data-video-title-policy="explicit-context-only"><title id="chart-title-my-svg">Illustrative pie relationships</title><desc id="chart-desc-my-svg">Synthetic records for Intake, Review, Build and Release. Values are illustrative and make no measured performance claim.</desc><style>#my-svg{font-family:Arial;font-size:16px;fill:#333e48;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#828282;}#my-svg .error-text{fill:#000000;stroke:#000000;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#696969;stroke:#696969;}#my-svg .marker.cross{stroke:#696969;}#my-svg svg{font-family:Arial;font-size:16px;}#my-svg p{margin:0;}#my-svg .pieCircle{stroke:#ffffff;stroke-width:2px;opacity:0.7;}#my-svg .pieCircle.highlighted{scale:1.05;opacity:1;}#my-svg .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#my-svg .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#my-svg .pieTitleText{text-anchor:middle;font-size:25px;fill:#333e48;font-family:Arial;}#my-svg .slice{font-family:Arial;fill:#ffffff;font-size:17px;}#my-svg .legend text{fill:#333e48;font-family:Arial;font-size:17px;}#my-svg .node .neo-node{stroke:#9e1b32;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#9e1b32;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg :root{--mermaid-font-family:Arial;}</style><g /><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle" style="stroke:none !important;stroke-width:0 !important;;fill:#ffffff!important;fill-opacity:1!important;stroke:#333e48!important;stroke-width:1.5px!important;;fill:#ffffff!important;fill-opacity:1!important;stroke:#333e48!important;stroke-width:1.5px!important;;fill:#ffffff!important;fill-opacity:1!important;stroke:#333e48!important;stroke-width:1.5px!important;;fill:#ffffff!important;fill-opacity:1!important;stroke:#333e48!important;stroke-width:1.5px!important;" /><path d="M0,-185A185,185,0,0,1,180.362,41.166L0,0Z" fill="#9e1b32" class="pieCircle" style="fill:#9e1b32 !important;fill-opacity:1 !important;opacity:1;stroke:none !important;stroke-width:0 !important;;fill:#ffffff!important;fill-opacity:1!important;stroke:#333e48!important;stroke-width:1.5px!important;;fill:#ffffff!important;fill-opacity:1!important;stroke:#333e48!important;stroke-width:1.5px!important;;fill:#ffffff!important;fill-opacity:1!important;stroke:#333e48!important;stroke-width:1.5px!important;;fill:#ffffff!important;fill-opacity:1!important;stroke:#333e48!important;stroke-width:1.5px!important;" /><path d="M180.362,41.166A185,185,0,0,1,27.573,182.934L0,0Z" fill="#000000" class="pieCircle" style="fill:#000000 !important;fill-opacity:1 !important;opacity:1;stroke:none !important;stroke-width:0 !important;;fill:#ffffff!important;fill-opacity:1!important;stroke:#333e48!important;stroke-width:1.5px!important;;fill:#ffffff!important;fill-opacity:1!important;stroke:#333e48!important;stroke-width:1.5px!important;;fill:#ffffff!important;fill-opacity:1!important;stroke:#333e48!important;stroke-width:1.5px!important;;fill:#ffffff!important;fill-opacity:1!important;stroke:#333e48!important;stroke-width:1.5px!important;" /><path d="M27.573,182.934A185,185,0,0,1,-144.639,-115.346L0,0Z" fill="#828282" class="pieCircle" style="fill:#828282 !important;fill-opacity:1 !important;opacity:1;stroke:none !important;stroke-width:0 !important;;fill:#ffffff!important;fill-opacity:1!important;stroke:#333e48!important;stroke-width:1.5px!important;;fill:#ffffff!important;fill-opacity:1!important;stroke:#333e48!important;stroke-width:1.5px!important;;fill:#ffffff!important;fill-opacity:1!important;stroke:#333e48!important;stroke-width:1.5px!important;;fill:#ffffff!important;fill-opacity:1!important;stroke:#333e48!important;stroke-width:1.5px!important;" /><path d="M-144.639,-115.346A185,185,0,0,1,0,-185L0,0Z" fill="#1c1c1c" class="pieCircle" style="fill:#1c1c1c !important;fill-opacity:1 !important;opacity:1;stroke:none !important;stroke-width:0 !important;;fill:#ffffff!important;fill-opacity:1!important;stroke:#333e48!important;stroke-width:1.5px!important;;fill:#ffffff!important;f