<svg xmlns="http://www.w3.org/2000/svg" id="my-svg" width="100%" style="max-width: 500px; background-color:white;" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg" data-category-presentation="solid-first" data-colorset="colorset1" data-palette-normalization="{&quot;#b9b9b9&quot;: &quot;#b5b5b5&quot;}" data-video-style="line-world" data-video-title-policy="explicit-context-only"><title id="chart-title-my-svg">Illustrative quadrant relationships</title><desc id="chart-desc-my-svg">Synthetic records for Intake, Review, Build and Release. Values are illustrative and make no measured performance claim.</desc><style>#my-svg{font-family:Arial;font-size:16px;fill:#333e48;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#828282;}#my-svg .error-text{fill:#000000;stroke:#000000;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#696969;stroke:#696969;}#my-svg .marker.cross{stroke:#696969;}#my-svg svg{font-family:Arial;font-size:16px;}#my-svg p{margin:0;}#my-svg .node .neo-node{stroke:#9e1b32;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(181,181,181,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:no