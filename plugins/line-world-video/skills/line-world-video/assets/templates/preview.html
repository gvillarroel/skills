<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Line World — timing studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f7;color:#333e48;font:15px Arial,sans-serif}main{max-width:1500px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{margin:0;font-size:22px}p{line-height:1.5}#screen{position:relative;background:#ffffff;aspect-ratio:16/9;cursor:grab;touch-action:none}iframe{border:0;width:100%;height:100%;pointer-events:none}#drag{position:absolute;inset:0}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:18px 0}button,select{background:#ffffff;color:#333e48;border:1px solid #cfcfcf;border-radius:5px;padding:12px;min-height:44px;cursor:pointer}button:hover{color:#9e1b32}input[type=range]{flex:1;accent-color:#9e1b32;min-width:140px}output{font-variant-numeric:tabular-nums;min-width:110px}.help{color:#696969;font-size:14px}code{color:#9e1b32}
</style></head><body><main><header><h1>Line World <span class="help">/ timing studio</span></h1><span class="help">Drag the canvas to explore</span></header><div id="screen"><iframe id="film" src="index.html" title="Seekable line-art video"></iframe><div id="drag" aria-label="Drag to pan the video canvas"></div></div><nav><button id="play">Play</button><button id="reset">Reset view</button><input id="seek" type="range" min="0" max="56" step="0.01" value="0" aria-label="Timeline seconds"><output id="time">0.00 / 56.00 s</output><select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option selected value="1">1×</option><option value="1.5">1.5×</option></select><select id="beat" aria-label="Jump to beat"></select></nav><p class="help">Edit <code>story.json → timing</code> and run the builder's <code>build</code> command to change exported timing. Playback speed affects this preview. This edition uses illustrative data; it makes no measured performance claims.</p></main><script>
const frame=document.getElementById('film'), seek=document.getElementById('seek'), time=document.getElementById('time'), play=document.getElementById('play'), beat=document.getElementById('beat');let current=0,last=0,playing=false,pan=[0,0],drag=null;
const pairing=document.createElement('p');pairing.id='pairing-review';pairing.className='help';document.querySelector('nav').after(pairing);
function draw(){const w=frame.contentWindow;if(!w.renderAt)return;current=Math.max(0,Math.min(w.STORY.duration-0.001,current));const state=w.renderAt(current,{pan});seek.value=current;time.textContent=current.toFixed(2)+' / '+w.STORY.duration.toFixed(2)+' s';const scene=w.STORY.scenePlan?.find(s=>s.id===state.beat);pairing.textContent=scene?scene.question+' '+scene.pairing:'';}
frame.onload=()=>{const w=frame.contentWindow;seek.max=w.STORY.duration;w.STORY.beats.forEach(b=>{const o=document.createElement('option');o.value=b.start;o.textContent=b.id+' · '+b.start.toFixed(1)+' s';beat.append(o)});draw()};seek.oninput=()=>{current=+seek.value;draw()};play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play'};beat.onchange=()=>{current=+beat.value;draw()};document.getElementById('reset').onclick=()=>{pan=[0,0];draw()};document.getElementById('drag').onpointerdown=e=>{drag=[e.clientX,e.clientY,...pan];e.target.setPointerCapture(e.pointerId)};document.getElementById('drag').onpointermove=e=>{if(drag){const scale=1920/frame.clientWidth;pan=[drag[2]+(e.clientX-drag[0])*scale,drag[3]+(e.clientY-drag[1])*scale];draw()}};document.getElementById('drag').onpointerup=()=>drag=null;
function tick(ms){if(playing&&last){current+=(ms-last)/1000*+document.getElementById('speed').value;if(current>=frame.contentWindow.STORY.duration){playing=false;play.textContent='Play'}draw()}last=ms;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
