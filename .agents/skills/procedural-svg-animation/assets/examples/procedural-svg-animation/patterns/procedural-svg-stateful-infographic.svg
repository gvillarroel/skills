  <title id="stateful-infographic-title">Stateful Infographic</title>
  <desc id="stateful-infographic-desc">One four-state clock coordinates card emphasis, staged route reveals, forward tokens, and a masked spotlight before returning to context. Deterministic seed 741874; full motion.</desc>

  <style>:root{color-scheme:light}
*{box-sizing:border-box}
.psvg-panel{fill:#ffffff;stroke:#cfcfcf;stroke-width:1.5}
.psvg-guide{fill:none;stroke:#cfcfcf;stroke-width:2}
.psvg-title{font:700 24px Arial,sans-serif;fill:#333e48}
.psvg-subtitle{font:13px Arial,sans-serif;fill:#696969}
.psvg-kicker{font:700 11px Arial,sans-serif;letter-spacing:1.222px;fill:#9e1b32}
.psvg-label{font:600 13px Arial,sans-serif;fill:#333e48}
.psvg-node-label{font:700 10px Arial,sans-serif;fill:#ffffff;pointer-events:none}
