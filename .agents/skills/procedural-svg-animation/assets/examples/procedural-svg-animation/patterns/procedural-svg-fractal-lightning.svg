  <title id="fractal-lightning-title">Fractal Lightning</title>
  <desc id="fractal-lightning-desc">Recursive midpoint displacement and branching create a deterministic electrical growth path. Deterministic seed 684860; full motion.</desc>
  <style>:root{color-scheme:light}
*{box-sizing:border-box}
.psvg-panel{fill:#ffffff;stroke:#cfcfcf;stroke-width:1.5}
.psvg-guide{fill:none;stroke:#cfcfcf;stroke-width:2}
