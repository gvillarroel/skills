  <title id="lighting-sweep-title">Lighting Sweep</title>
  <desc id="lighting-sweep-desc">An animated light source sweeps across a generated relief field using SVG lighting primitives. Deterministic seed 576833; full motion.</desc>
  <style>:root{color-scheme:light}
